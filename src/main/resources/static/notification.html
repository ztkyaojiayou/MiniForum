<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息通知</title>
    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        :root, [data-theme="light"] {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #333333;
            --text-heading: #1a1a2e;
            --muted: #999999;
            --muted-2: #666666;
            --border: #d9d9d9;
            --border-row: #f0f0f0;
            --primary: #4a7cff;
            --primary-hover: #3a66e0;
            --shadow-card: rgba(0,0,0,0.08);
            --input-bg: #ffffff;
            --tag-bg: #eef2ff;
            --tag-text: #4a7cff;
            --composer-bg: #f7f8fa;
        }
        [data-theme="dark"] {
            --bg: #1a1a2e;
            --card-bg: #24243e;
            --text: #e4e4e4;
            --text-heading: #ffffff;
            --muted: #8f8fa8;
            --muted-2: #a8a8c0;
            --border: #3a3a5c;
            --border-row: #33334f;
            --primary: #5a8cff;
            --primary-hover: #6f9bff;
            --shadow-card: rgba(0,0,0,0.4);
            --input-bg: #2c2c4a;
            --tag-bg: #2e3a5c;
            --tag-text: #8fb0ff;
            --composer-bg: #2a2a48;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background .3s, color .3s;
        }
        .navbar {
            position: sticky; top: 0; z-index: 100;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-row);
            padding: 0 20px; height: 56px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 1px 4px var(--shadow-card);
        }
        .navbar .brand { font-size: 20px; font-weight: 700; color: var(--primary); cursor: pointer; }
        .navbar .nav-right { display: flex; align-items: center; gap: 12px; }
        .nav-link {
            text-decoration: none; color: var(--muted-2); font-size: 14px;
            padding: 6px 10px; border-radius: 6px; transition: all .2s;
        }
        .nav-link:hover { color: var(--primary); background: var(--composer-bg); }
        .nav-link.active { color: var(--primary); font-weight: 600; }
        .nav-badge {
            display: inline-block; min-width: 18px; height: 18px; line-height: 18px;
            background: #ff4d4f; color: #fff; font-size: 11px; text-align: center;
            border-radius: 9px; padding: 0 5px; margin-left: 2px; vertical-align: top;
        }
        .navbar .username-tag { font-size: 14px; color: var(--muted-2); }
        .navbar .username-tag b { color: var(--primary); font-weight: 600; }
        .navbar .logout-btn {
            background: none; border: 1px solid var(--border); color: var(--muted-2);
            font-size: 13px; padding: 4px 12px; border-radius: 16px; cursor: pointer; transition: all .2s;
        }
        .navbar .logout-btn:hover { border-color: #ff4d4f; color: #ff4d4f; }
        .theme-toggle {
            width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
            background: var(--card-bg); color: var(--text); font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all .3s;
        }
        .theme-toggle:hover { border-color: var(--primary); }
        .container { max-width: 720px; margin: 0 auto; padding: 24px 20px 60px; }
        .back-link { display: inline-block; color: var(--primary); text-decoration: none; font-size: 14px; margin-bottom: 16px; }
        .back-link:hover { text-decoration: underline; }
        .page-title {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 16px;
        }
        .page-title h2 { font-size: 20px; color: var(--text-heading); }
        .btn {
            background: var(--primary); color: #fff; border: none; border-radius: 18px;
            padding: 8px 18px; font-size: 13px; cursor: pointer; transition: all .2s;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn-cancel {
            background: transparent; border: 1px solid var(--border); color: var(--muted-2);
        }
        .btn-cancel:hover { border-color: var(--primary); color: var(--primary); background: transparent; }
        .notif-item {
            background: var(--card-bg); border-radius: 12px; box-shadow: 0 2px 12px var(--shadow-card);
            padding: 16px 20px; margin-bottom: 12px; display: flex; align-items: center; gap: 14px;
            transition: background .3s; cursor: pointer;
        }
        .notif-item:hover { box-shadow: 0 4px 16px var(--shadow-card); }
        .notif-item.unread { border-left: 4px solid var(--primary); }
        .notif-icon {
            width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            background: var(--composer-bg);
        }
        .notif-body { flex: 1; min-width: 0; }
        .notif-content { font-size: 14px; color: var(--text); line-height: 1.6; word-break: break-word; }
        .notif-content b { color: var(--primary); }
        .notif-time { font-size: 12px; color: var(--muted); margin-top: 4px; }
        .notif-badge {
            flex-shrink: 0; font-size: 11px; color: #ff4d4f; border: 1px solid #ff4d4f;
            padding: 2px 8px; border-radius: 10px;
        }
        .empty { text-align: center; color: var(--muted); padding: 40px 0; }
        .loading { text-align: center; color: var(--muted); padding: 20px; }
        .toast {
            position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: #333; color: #fff; padding: 10px 24px; border-radius: 20px;
            font-size: 14px; opacity: 0; transition: all .3s; z-index: 999;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.error { background: #ff4d4f; }
        .fade-in { animation: fadeIn .4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="brand" onclick="window.location.href='/index.html'">📢 动态广场</div>
        <div class="nav-right">
            <a class="nav-link" href="/quote.html">💡 灵感</a>
            <a class="nav-link" href="/wheel.html">🎡 转盘</a>
            <a class="nav-link" href="/my.html">📝 我的文章</a>
            <a class="nav-link active" href="/notification.html">🔔 通知<span class="nav-badge" id="navBadge" style="display:none;">0</span></a>
            <span class="username-tag">👤 <b id="currentUser"></b></span>
            <button class="theme-toggle" id="themeToggle" title="切换主题" onclick="toggleTheme()">🌙</button>
            <button class="logout-btn" onclick="logout()">退出</button>
        </div>
    </div>

    <div class="container">
        <a class="back-link" href="/index.html">← 返回动态列表</a>
        <div class="page-title">
            <h2>🔔 消息通知</h2>
            <button class="btn btn-cancel" onclick="markAllRead()">✅ 全部已读</button>
        </div>
        <div id="loading" class="loading">加载中...</div>
        <div id="notifList"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show ' + (type || '');
            setTimeout(() => { toast.className = 'toast'; }, 2500);
        }
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        function formatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            const pad = n => (n < 10 ? '0' + n : '' + n);
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
                + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }
        async function request(url, options) {
            const res = await fetch(url, options);
            let data = null;
            try { data = await res.json(); } catch (e) {}
            if (!res.ok) {
                let msg = '请求失败 (' + res.status + ')';
                if (data && data.message) msg = data.message;
                throw new Error(msg);
            }
            if (data && typeof data === 'object' && 'code' in data) {
                if (data.code !== 0) throw new Error(data.message || '请求失败');
                return data.data;
            }
            return data;
        }
        function typeIcon(type) {
            if (type === 'LIKE') return '❤️';
            if (type === 'COMMENT') return '💬';
            if (type === 'FOLLOW') return '👥';
            return '🔔';
        }
        function renderBadge(count) {
            const badge = document.getElementById('navBadge');
            if (count > 0) {
                badge.textContent = count > 99 ? '99+' : count;
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }
        }
        async function loadNotifications() {
            const list = document.getElementById('notifList');
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            try {
                const notifs = await request('/api/notifications');
                loading.style.display = 'none';
                list.innerHTML = '';
                if (!notifs || notifs.length === 0) {
                    list.innerHTML = '<div class="empty">暂无通知，快去互动吧～</div>';
                    return;
                }
                notifs.forEach((n, i) => {
                    const div = document.createElement('div');
                    div.className = 'notif-item fade-in' + (n.read ? '' : ' unread');
                    div.style.animationDelay = (i * 0.03) + 's';
                    const actorLink = n.actorId ? '<a class="author-link" style="color:var(--primary);text-decoration:none;" href="/user.html?id=' + n.actorId + '"><b>' + escapeHtml(n.actorUsername) + '</b></a>' : '<b>' + escapeHtml(n.actorUsername) + '</b>';
                    div.innerHTML = `
                        <div class="notif-icon">${typeIcon(n.type)}</div>
                        <div class="notif-body">
                            <div class="notif-content">${actorLink} ${escapeHtml(n.content)}</div>
                            <div class="notif-time">🕐 ${formatTime(n.createdAt)}</div>
                        </div>
                        ${n.read ? '' : '<span class="notif-badge">未读</span>'}`;
                    div.addEventListener('click', function () {
                        if (!n.read) {
                            fetch('/api/notifications/' + n.id + '/read', { method: 'PUT' }).catch(() => {});
                            div.classList.remove('unread');
                            div.querySelector('.notif-badge').remove();
                            loadUnreadCount();
                        }
                        if (n.postId) {
                            window.location.href = '/detail.html?id=' + n.postId;
                        }
                    });
                    list.appendChild(div);
                });
            } catch (e) {
                loading.style.display = 'none';
                list.innerHTML = '<div class="empty">加载失败：' + escapeHtml(e.message) + '</div>';
            }
        }
        async function loadUnreadCount() {
            try {
                const data = await request('/api/notifications/unread-count');
                renderBadge(data.count || 0);
            } catch (e) {}
        }
        async function markAllRead() {
            try {
                await request('/api/notifications/read-all', { method: 'PUT' });
                document.querySelectorAll('.notif-item.unread').forEach(el => {
                    el.classList.remove('unread');
                    const b = el.querySelector('.notif-badge');
                    if (b) b.remove();
                });
                renderBadge(0);
                showToast('✅ 已全部标记为已读', 'success');
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }
        async function checkLogin() {
            try {
                const res = await fetch('/api/auth/me');
                const data = await res.json();
                if (!res.ok || data.code !== 0) {
                    window.location.href = '/login.html';
                    return;
                }
                document.getElementById('currentUser').textContent = data.data.username;
                loadUnreadCount();
                loadNotifications();
            } catch (e) {
                window.location.href = '/login.html';
            }
        }
        async function logout() {
            try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (e) {}
            window.location.href = '/login.html';
        }
        checkLogin();

        function updateToggleIcon() {
            const theme = document.documentElement.getAttribute('data-theme');
            document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateToggleIcon();
        }
        updateToggleIcon();
    </script>
</body>
</html>
