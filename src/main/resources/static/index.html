<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态广场</title>
    <script>
        // 防闪烁：在渲染前根据 localStorage 或系统偏好设置主题
        (function () {
            var saved = localStorage.getItem('theme');
            var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        :root, [data-theme="light"] {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #333333;
            --text-heading: #1a1a2e;
            --muted: #999999;
            --muted-2: #666666;
            --border: #d9d9d9;
            --border-row: #f0f0f0;
            --primary: #4a7cff;
            --primary-hover: #3a66e0;
            --shadow-card: rgba(0,0,0,0.08);
            --input-bg: #ffffff;
            --tag-bg: #eef2ff;
            --tag-text: #4a7cff;
            --composer-bg: #f7f8fa;
        }
        [data-theme="dark"] {
            --bg: #1a1a2e;
            --card-bg: #24243e;
            --text: #e4e4e4;
            --text-heading: #ffffff;
            --muted: #8f8fa8;
            --muted-2: #a8a8c0;
            --border: #3a3a5c;
            --border-row: #33334f;
            --primary: #5a8cff;
            --primary-hover: #6f9bff;
            --shadow-card: rgba(0,0,0,0.4);
            --input-bg: #2c2c4a;
            --tag-bg: #2e3a5c;
            --tag-text: #8fb0ff;
            --composer-bg: #2a2a48;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background .3s, color .3s;
        }
        /* ===== 顶部导航栏 ===== */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-row);
            padding: 0 20px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 4px var(--shadow-card);
            transition: background .3s;
        }
        .navbar .brand { font-size: 20px; font-weight: 700; color: var(--primary); }
        .navbar .nav-right { display: flex; align-items: center; gap: 12px; }
        .nav-link {
            text-decoration: none;
            color: var(--muted-2);
            font-size: 14px;
            padding: 6px 10px;
            border-radius: 6px;
            transition: all .2s;
            border: 1px solid transparent;
        }
        .nav-link:hover { color: var(--primary); background: var(--composer-bg); }
        .nav-link.btn-user {
            border: 1px solid var(--border);
            border-radius: 16px;
            font-size: 13px;
            padding: 4px 12px;
            color: var(--muted-2);
        }
        .nav-link.btn-user:hover { border-color: var(--primary); color: var(--primary); background: transparent; }
        .navbar .username-tag { font-size: 14px; color: var(--muted-2); }
        .navbar .username-tag b { color: var(--primary); font-weight: 600; }
        .navbar .logout-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--muted-2);
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 16px;
            cursor: pointer;
            transition: all .2s;
        }
        .navbar .logout-btn:hover { border-color: #ff4d4f; color: #ff4d4f; }
        .theme-toggle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .3s;
        }
        .theme-toggle:hover { border-color: var(--primary); }
        /* ===== 主内容 ===== */
        .container { max-width: 720px; margin: 0 auto; padding: 24px 20px 60px; }
        /* ---- 发帖框（微博式） ---- */
        .composer {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 12px var(--shadow-card);
            padding: 20px;
            margin-bottom: 24px;
            transition: background .3s;
        }
        .composer .composer-title { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .composer .composer-title span { font-size: 16px; font-weight: 600; color: var(--text-heading); }
        .composer input[type="text"], .composer textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            background: var(--composer-bg);
            color: var(--text);
            transition: border-color .2s, background .3s, color .3s;
        }
        .composer input[type="text"] { margin-bottom: 10px; }
        .composer textarea { min-height: 100px; resize: vertical; }
        .composer input:focus, .composer textarea:focus { outline: none; border-color: var(--primary); background: var(--input-bg); }
        .composer .composer-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
        .btn {
            padding: 10px 28px;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            color: #fff;
            background: var(--primary);
            transition: all .2s;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        /* ---- 帖子列表（微博式信息流） ---- */
        .feed-title { display: flex; align-items: center; gap: 8px; margin: 8px 0 16px; color: var(--text-heading); font-size: 18px; font-weight: 700; }
        .post {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 12px var(--shadow-card);
            padding: 20px 24px;
            margin-bottom: 16px;
            transition: background .3s;
        }
        .post .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .post .avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 600;
            flex-shrink: 0;
        }
        .post .post-author { font-size: 15px; font-weight: 600; color: var(--text-heading); }
        .post .post-time { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .post .post-title { font-size: 16px; font-weight: 600; color: var(--text-heading); margin-bottom: 8px; }
        .post .post-title-link { color: var(--text-heading); text-decoration: none; }
        .post .post-title-link:hover { color: var(--primary); text-decoration: underline; }
        .post .post-detail-link { font-size: 13px; color: var(--primary); text-decoration: none; }
        .post .post-detail-link:hover { text-decoration: underline; }
        .post .post-content {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 12px;
        }
        .post .post-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border-row);
            padding-top: 10px;
        }
        .post .post-id { font-size: 12px; color: var(--muted); }
        .pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
        .pagination button {
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--card-bg);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            transition: all .2s;
        }
        .pagination button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
        .pagination button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .pagination .page-info { font-size: 13px; color: var(--muted); }
        .empty { text-align: center; color: var(--muted); padding: 40px 0; }
        .loading { text-align: center; color: var(--muted); padding: 20px; }
        /* 弹窗 */
        .modal-mask {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-mask.show { display: flex; }
        .modal {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            width: 640px;
            max-width: 92%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            transition: background .3s;
        }
        .modal h3 { font-size: 18px; color: var(--text-heading); margin-bottom: 16px; }
        .modal .form-group { margin-bottom: 12px; display: flex; flex-direction: column; }
        .modal .form-group label { font-size: 13px; color: var(--muted-2); margin-bottom: 4px; }
        .modal .form-group input {
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background: var(--input-bg);
            color: var(--text);
        }
        .modal .form-group input:focus { outline: none; border-color: var(--primary); }
        .modal .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border-row); font-size: 14px; }
        th { background: var(--composer-bg); font-weight: 600; color: var(--muted-2); }
        .btn-sm { padding: 4px 12px; font-size: 13px; border-radius: 6px; }
        .btn-warning { background: #faad14; }
        .btn-warning:hover { background: #d9940f; }
        .btn-danger { background: #ff4d4f; }
        .btn-danger:hover { background: #e03a3c; }
        .btn-success { background: #52c41a; }
        .btn-success:hover { background: #43a813; }
        .btn-cancel { background: var(--composer-bg); color: var(--muted-2); border: 1px solid var(--border); }
        .btn-cancel:hover { background: var(--border-row); }
        .actions { display: flex; gap: 6px; }
        .toast {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #333;
            color: #fff;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: all .3s;
            z-index: 999;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.error { background: #ff4d4f; }
        .toast.success { background: #52c41a; }
        .fade-in { animation: fadeIn .4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="navbar">
        <div class="brand">📢 动态广场</div>
        <div class="nav-right">
            <a class="nav-link" href="/quote.html">💡 灵感</a>
            <a class="nav-link" href="/wheel.html">🎡 转盘</a>
            <a class="nav-link btn-user" href="javascript:void(0)" onclick="openUserModal()">👥 用户管理</a>
            <span class="username-tag">👤 <b id="currentUser"></b></span>
            <button class="theme-toggle" id="themeToggle" title="切换主题" onclick="toggleTheme()">🌙</button>
            <button class="logout-btn" onclick="logout()">退出</button>
        </div>
    </div>

    <div class="container">
        <!-- 发帖框（微博式，显眼） -->
        <div class="composer">
            <div class="composer-title"><span>✍️ 有什么新鲜事想分享？</span></div>
            <input type="text" id="postTitle" maxlength="100" placeholder="标题（选填）">
            <textarea id="postContent" maxlength="5000" placeholder="分享你的想法、动态..."></textarea>
            <div class="composer-actions">
                <button class="btn" id="publishBtn" onclick="publishPost()">🚀 发布</button>
            </div>
        </div>

        <!-- 帖子信息流 -->
        <div class="feed-title">📚 最新动态</div>
        <div id="loading" class="loading">加载中...</div>
        <div id="postList"></div>
    <div id="pagination" class="pagination"></div>
    </div>

    <!-- 用户管理弹窗 -->
    <div class="modal-mask" id="userModal">
        <div class="modal">
            <h3>👥 用户管理</h3>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="createUsername" placeholder="用户名">
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="createEmail" placeholder="user@example.com">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="createPassword" placeholder="6-20位">
            </div>
            <div class="form-group">
                <label>年龄</label>
                <input type="number" id="createAge" placeholder="年龄">
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeUserModal()">关闭</button>
                <button class="btn btn-success btn-sm" onclick="createUser()">➕ 添加用户</button>
            </div>
            <div style="margin-top:16px; max-height:300px; overflow-y:auto;">
                <table>
                    <thead>
                        <tr><th>ID</th><th>用户名</th><th>邮箱</th><th>年龄</th><th>操作</th></tr>
                    </thead>
                    <tbody id="userBody"></tbody>
                </table>
                <div id="userEmpty" class="empty" style="display:none;">暂无用户</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const POST_API = '/api/posts';
        const USER_API = '/api/users';

        // ---------- 工具 ----------
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show ' + (type || '');
            setTimeout(() => { toast.className = 'toast'; }, 2500);
        }
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        function formatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            const pad = n => (n < 10 ? '0' + n : '' + n);
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
                + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }
        async function request(url, options) {
            const res = await fetch(url, options);
            let data = null;
            try { data = await res.json(); } catch (e) {}
            if (!res.ok) {
                let msg = '请求失败 (' + res.status + ')';
                if (data && data.message) msg = data.message;
                throw new Error(msg);
            }
            if (data && typeof data === 'object' && 'code' in data) {
                if (data.code !== 0) throw new Error(data.message || '请求失败');
                return data.data;
            }
            return data;
        }

        // ---------- 发帖 ----------
        async function publishPost() {
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            if (!content) { showToast('❌ 内容不能为空', 'error'); return; }
            const btn = document.getElementById('publishBtn');
            btn.disabled = true;
            try {
                await request(POST_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content })
                });
                showToast('✅ 发布成功', 'success');
                document.getElementById('postTitle').value = '';
                document.getElementById('postContent').value = '';
                loadPosts();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            } finally {
                btn.disabled = false;
            }
        }

        // ---------- 加载帖子信息流（分页） ----------
        let currentPage = 1;
        const PAGE_SIZE = 10;
        async function loadPosts(page) {
            if (page) currentPage = page;
            const list = document.getElementById('postList');
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            try {
                const data = await request(POST_API + '?page=' + currentPage + '&size=' + PAGE_SIZE);
                const posts = data.records || [];
                list.innerHTML = '';
                if (!posts || posts.length === 0) {
                    list.innerHTML = '<div class="empty">还没有动态，快来发布第一条吧～</div>';
                } else {
                    posts.forEach((p, i) => {
                        const div = document.createElement('div');
                        div.className = 'post fade-in';
                        div.style.animationDelay = (i * 0.05) + 's';
                        const avatarChar = (p.author || '?').charAt(0).toUpperCase();
                        div.innerHTML = `
                            <div class="post-header">
                                <div class="avatar">${escapeHtml(avatarChar)}</div>
                                <div>
                                    <div class="post-author">${escapeHtml(p.author)}</div>
                                    <div class="post-time">🕐 ${formatTime(p.createdAt)}</div>
                                </div>
                            </div>
                            ${p.title ? `<div class="post-title"><a class="post-title-link" href="/detail.html?id=${p.id}">${escapeHtml(p.title)}</a></div>` : ''}
                            <div class="post-content">${escapeHtml(p.content)}</div>
                            <div class="post-footer">
                                <span class="post-id">#${p.id}</span>
                                <span><a class="post-detail-link" href="/detail.html?id=${p.id}">📖 查看全文</a></span>
                            </div>`;
                        list.appendChild(div);
                    });
                }
                renderPagination(data.total, data.totalPages);
            } catch (e) {
                list.innerHTML = '<div class="empty">加载失败：' + escapeHtml(e.message) + '</div>';
                document.getElementById('pagination').innerHTML = '';
            } finally {
                loading.style.display = 'none';
            }
        }
        function renderPagination(total, totalPages) {
            const box = document.getElementById('pagination');
            if (!total || totalPages <= 1) { box.innerHTML = ''; return; }
            let html = '<button class="page-btn" data-page="' + (currentPage - 1) + '" ' + (currentPage <= 1 ? 'disabled' : '') + '>‹ 上一页</button>';
            for (let i = 1; i <= totalPages; i++) {
                html += '<button class="page-btn' + (i === currentPage ? ' active' : '') + '" data-page="' + i + '">' + i + '</button>';
            }
            html += '<button class="page-btn" data-page="' + (currentPage + 1) + '" ' + (currentPage >= totalPages ? 'disabled' : '') + '>下一页 ›</button>';
            html += '<span class="page-info">共 ' + total + ' 条</span>';
            box.innerHTML = html;
            box.querySelectorAll('.page-btn').forEach(btn => {
                btn.addEventListener('click', function () {
                    if (this.disabled) return;
                    const target = parseInt(this.getAttribute('data-page'), 10);
                    if (target >= 1 && target <= totalPages) loadPosts(target);
                });
            });
        }

        // ---------- 用户管理 ----------
        function openUserModal() {
            document.getElementById('userModal').classList.add('show');
            loadUsers();
        }
        function closeUserModal() {
            document.getElementById('userModal').classList.remove('show');
        }
        document.getElementById('userModal').addEventListener('click', function (e) {
            if (e.target === this) closeUserModal();
        });
        async function loadUsers() {
            const body = document.getElementById('userBody');
            const empty = document.getElementById('userEmpty');
            try {
                const users = await request(USER_API);
                body.innerHTML = '';
                if (!users || users.length === 0) {
                    empty.style.display = 'block';
                } else {
                    empty.style.display = 'none';
                    users.forEach(u => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${u.id}</td>
                            <td>${escapeHtml(u.username)}</td>
                            <td>${escapeHtml(u.email)}</td>
                            <td>${u.age}</td>
                            <td><div class="actions">
                                <button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id})">删除</button>
                            </div></td>`;
                        body.appendChild(tr);
                    });
                }
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }
        async function createUser() {
            const username = document.getElementById('createUsername').value.trim();
            const email = document.getElementById('createEmail').value.trim();
            const password = document.getElementById('createPassword').value;
            const age = parseInt(document.getElementById('createAge').value, 10);
            if (!username || !email || !password) { showToast('❌ 请填写用户名/邮箱/密码', 'error'); return; }
            try {
                await request(USER_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, age })
                });
                showToast('✅ 添加成功', 'success');
                document.getElementById('createUsername').value = '';
                document.getElementById('createEmail').value = '';
                document.getElementById('createPassword').value = '';
                document.getElementById('createAge').value = '';
                loadUsers();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }
        async function deleteUser(id) {
            if (!confirm('确定要删除用户 ID=' + id + ' 吗？')) return;
            try {
                await request(USER_API + '/' + id, { method: 'DELETE' });
                showToast('🗑️ 删除成功', 'success');
                loadUsers();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        // ---------- 登录校验 ----------
        async function checkLogin() {
            try {
                const res = await fetch('/api/auth/me');
                const data = await res.json();
                if (!res.ok || data.code !== 0) {
                    window.location.href = '/login.html';
                    return;
                }
                document.getElementById('currentUser').textContent = data.data.username;
                loadPosts();
            } catch (e) {
                window.location.href = '/login.html';
            }
        }
        async function logout() {
            try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (e) {}
            window.location.href = '/login.html';
        }
        checkLogin();

        // ---------- 主题切换 ----------
        function updateToggleIcon() {
            const theme = document.documentElement.getAttribute('data-theme');
            document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateToggleIcon();
        }
        updateToggleIcon();
    </script>
</body>
</html>
