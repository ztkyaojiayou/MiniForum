<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态广场</title>
    <script>
        // 防闪烁：在渲染前根据 localStorage 或系统偏好设置主题
        (function () {
            var saved = localStorage.getItem('theme');
            var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        :root, [data-theme="light"] {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #333333;
            --text-heading: #1a1a2e;
            --muted: #999999;
            --muted-2: #666666;
            --border: #d9d9d9;
            --border-row: #f0f0f0;
            --primary: #4a7cff;
            --primary-hover: #3a66e0;
            --shadow-card: rgba(0,0,0,0.08);
            --input-bg: #ffffff;
            --tag-bg: #eef2ff;
            --tag-text: #4a7cff;
            --composer-bg: #f7f8fa;
        }
        [data-theme="dark"] {
            --bg: #1a1a2e;
            --card-bg: #24243e;
            --text: #e4e4e4;
            --text-heading: #ffffff;
            --muted: #8f8fa8;
            --muted-2: #a8a8c0;
            --border: #3a3a5c;
            --border-row: #33334f;
            --primary: #5a8cff;
            --primary-hover: #6f9bff;
            --shadow-card: rgba(0,0,0,0.4);
            --input-bg: #2c2c4a;
            --tag-bg: #2e3a5c;
            --tag-text: #8fb0ff;
            --composer-bg: #2a2a48;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background .3s, color .3s;
        }
        /* ===== 顶部导航栏 ===== */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-row);
            padding: 0 20px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 4px var(--shadow-card);
            transition: background .3s;
        }
        .navbar .brand { font-size: 20px; font-weight: 700; color: var(--primary); }
        .navbar .nav-right { display: flex; align-items: center; gap: 12px; }
        /* 顶部导航搜索框（居中显眼） */
        .navbar .navbar-search { flex: 1; display: flex; justify-content: center; padding: 0 16px; }
        .navbar .navbar-search .search-box input { width: 340px; padding: 7px 16px; border-radius: 18px; font-size: 14px; }
        .navbar .navbar-search .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px var(--tag-bg); }
        .navbar .navbar-search .btn-search { padding: 5px 16px; font-size: 13px; border-radius: 16px; }
        .nav-link {
            text-decoration: none;
            color: var(--muted-2);
            font-size: 14px;
            padding: 6px 10px;
            border-radius: 6px;
            transition: all .2s;
            border: 1px solid transparent;
        }
        .nav-link:hover { color: var(--primary); background: var(--composer-bg); }
        .nav-badge {
            display: inline-block; min-width: 18px; height: 18px; line-height: 18px;
            background: #ff4d4f; color: #fff; font-size: 11px; text-align: center;
            border-radius: 9px; padding: 0 5px; margin-left: 2px; vertical-align: top;
        }
        .nav-link.btn-user {
            border: 1px solid var(--border);
            border-radius: 16px;
            font-size: 13px;
            padding: 4px 12px;
            color: var(--muted-2);
        }
        .nav-link.btn-user:hover { border-color: var(--primary); color: var(--primary); background: transparent; }
        .navbar .username-tag { font-size: 14px; color: var(--muted-2); text-decoration: none; }
        .navbar .username-tag b { color: var(--primary); font-weight: 600; }
        .navbar .username-tag:hover { color: var(--primary); }
        .navbar .logout-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--muted-2);
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 16px;
            cursor: pointer;
            transition: all .2s;
        }
        .navbar .logout-btn:hover { border-color: #ff4d4f; color: #ff4d4f; }
        .navbar .login-btn {
            background: none;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-size: 13px;
            font-weight: 500;
            padding: 4px 14px;
            border-radius: 16px;
            cursor: pointer;
            transition: all .2s;
        }
        .navbar .login-btn:hover { background: var(--primary); color: #fff; }
        .theme-toggle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .3s;
        }
        .theme-toggle:hover { border-color: var(--primary); }
        /* ===== 主内容 ===== */
        /* ===== 主内容 ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px 60px;
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        /* 左栏：分类导航 */
        .side-left { flex: 0 0 220px; position: sticky; top: 80px; }
        /* 中栏：发帖 + 信息流 */
        .main-center { flex: 1 1 auto; min-width: 0; }
        /* 右栏：热搜榜 */
        .side-right { flex: 0 0 300px; position: sticky; top: 80px; }
        .side-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 12px var(--shadow-card);
            padding: 16px;
            margin-bottom: 20px;
            transition: background .3s;
        }
        .side-card h3 { font-size: 15px; font-weight: 700; color: var(--text-heading); margin-bottom: 12px; }
        .cat-list { list-style: none; }
        .cat-list li {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 12px; border-radius: 10px; cursor: pointer;
            color: var(--muted-2); font-size: 14px; transition: all .2s;
        }
        .cat-list li:hover { background: var(--composer-bg); color: var(--primary); }
        .cat-list li.active { background: var(--tag-bg); color: var(--tag-text); font-weight: 600; }
        .cat-list li .cat-count { margin-left: auto; font-size: 12px; color: var(--muted); }
        .hot-list { list-style: none; }
        .hot-list li {
            display: flex; align-items: flex-start; gap: 10px;
            padding: 9px 4px; border-bottom: 1px dashed var(--border-row); cursor: pointer; transition: all .2s;
        }
        .hot-list li:last-child { border-bottom: none; }
        .hot-list li:hover { background: var(--composer-bg); border-radius: 8px; }
        .hot-rank {
            flex: 0 0 24px; height: 24px; line-height: 24px; text-align: center;
            border-radius: 6px; font-size: 13px; font-weight: 700; background: var(--composer-bg); color: var(--muted-2);
        }
        .hot-list li:nth-child(-n+3) .hot-rank { background: #ff4d4f; color: #fff; }
        .hot-word { font-size: 14px; color: var(--text); word-break: break-all; }
        .hot-heat { font-size: 12px; color: var(--muted); }
        /* ---- 热搜榜（仿微博） ---- */
        .side-card-head { display: flex; align-items: center; justify-content: space-between; }
        .hot-refresh { border: none; background: none; cursor: pointer; font-size: 14px; color: var(--muted); transition: transform .3s; }
        .hot-refresh:hover { color: var(--primary); transform: rotate(180deg); }
        .hot-search-list { list-style: none; }
        .hot-search-list li {
            display: flex; align-items: center; gap: 8px; padding: 8px 4px;
            border-bottom: 1px dashed var(--border-row); cursor: pointer; transition: all .2s;
        }
        .hot-search-list li:last-child { border-bottom: none; }
        .hot-search-list li:hover { background: var(--composer-bg); border-radius: 8px; }
        .hot-search-list .hot-rank { flex: 0 0 24px; }
        .hot-rank.hot-rank-top { background: #ff4d4f; color: #fff; font-size: 15px; }
        .hot-search-list .hot-word { flex: 1; font-size: 14px; }
        .hot-level { font-size: 11px; padding: 1px 5px; border-radius: 4px; font-weight: 600; flex-shrink: 0; }
        .lv-爆 { background: #ffecec; color: #ff4d4f; }
        .lv-沸 { background: #fff3e0; color: #ff8200; }
        .lv-热 { background: var(--composer-bg); color: var(--muted-2); }
        .lv-新 { background: #e6f7ff; color: #1890ff; }
        .hot-trend { font-size: 12px; flex-shrink: 0; }
        .hot-trend.up { color: #ff4d4f; }
        .hot-trend.down { color: #52c41a; }
        .hot-trend.new { color: #1890ff; }
        .hot-search-list .hot-heat { font-size: 12px; color: var(--muted); flex-shrink: 0; }
        .hot-more { margin-top: 8px; text-align: center; font-size: 13px; }
        .hot-more a { color: var(--primary); text-decoration: none; }
        .hot-more a:hover { text-decoration: underline; }
        /* ---- 发博字数临界提示 ---- */
        .composer-count { font-size: 12px; color: var(--muted); margin-right: 10px; align-self: center; }
        .composer-count.warn { color: #ff8200; font-weight: 600; }
        .composer-count.danger { color: #ff4d4f; font-weight: 700; }
        /* ---- 点赞点亮动效 ---- */
        @keyframes likePop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
        .like-btn.like-pop { animation: likePop .3s ease; display: inline-block; }
        /* ---- 转发弹窗"同时评论" ---- */
        .repost-as-comment { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted-2); margin-bottom: 14px; cursor: pointer; }
        .composer select {
            width: 100%; padding: 10px 12px; margin-bottom: 10px;
            border: 1px solid var(--border); border-radius: 10px; font-size: 13px;
            background: var(--composer-bg); color: var(--text); transition: border-color .2s, background .3s, color .3s;
        }
        @media (max-width: 1024px) {
            .side-left, .side-right { display: none; }
        }
        /* ---- 发帖框（微博式） ---- */
        .composer {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 12px var(--shadow-card);
            padding: 20px;
            margin-bottom: 24px;
            transition: background .3s;
        }
        .composer .composer-title { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .composer .composer-title span { font-size: 16px; font-weight: 600; color: var(--text-heading); }
        .guest-prompt {
            padding: 18px 20px; text-align: center; margin-bottom: 4px;
            background: var(--composer-bg); border: 1px dashed var(--primary); border-radius: 10px;
            color: var(--muted-2); font-size: 14px;
        }
        .guest-prompt .guest-login-link {
            color: var(--primary); font-weight: 600; text-decoration: none; margin-left: 6px;
        }
        .guest-prompt .guest-login-link:hover { text-decoration: underline; }
        .composer .article-entry {
            margin-left: auto;
            font-size: 13px;
            font-weight: 500;
            color: var(--primary);
            text-decoration: none;
            background: var(--tag-bg);
            padding: 6px 14px;
            border-radius: 16px;
            transition: filter .2s;
            white-space: nowrap;
        }
        .composer .article-entry:hover { filter: brightness(1.15); }
        .composer input[type="text"], .composer textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            background: var(--composer-bg);
            color: var(--text);
            transition: border-color .2s, background .3s, color .3s;
        }
        .composer input[type="text"] { margin-bottom: 10px; }
        .composer textarea { min-height: 100px; resize: vertical; }
        .composer input[type="text"].tag-input { margin-top: 10px; margin-bottom: 0; font-size: 13px; }
        .search-box { display: flex; align-items: center; gap: 6px; }
        .search-box input {
            padding: 6px 12px; border: 1px solid var(--border); border-radius: 16px;
            font-size: 13px; background: var(--input-bg); color: var(--text); width: 220px; outline: none;
            transition: border-color .2s;
        }
        .search-box input:focus { border-color: var(--primary); }
        .btn-search { padding: 4px 12px; font-size: 13px; border-radius: 16px; }
        .tag-chip {
            display: inline-block; padding: 2px 10px; margin: 0 6px 6px 0;
            background: var(--tag-bg); color: var(--tag-text); border-radius: 12px;
            font-size: 12px; cursor: pointer; transition: all .2s;
        }
        .tag-chip:hover { filter: brightness(1.15); }
        .post .post-tags { margin-bottom: 8px; }
        .post-actions { display: flex; align-items: center; gap: 12px; }
        .like-btn {
            background: none; border: 1px solid var(--border); border-radius: 14px;
            padding: 3px 12px; font-size: 13px; color: var(--muted-2); cursor: pointer; transition: all .2s;
        }
        .like-btn:hover { border-color: #ff4d4f; color: #ff4d4f; }
        .like-btn.liked { border-color: #ff4d4f; color: #ff4d4f; background: rgba(255,77,79,0.08); }
        .stat-link { font-size: 13px; color: var(--muted-2); text-decoration: none; }
        .stat-link:hover { color: var(--primary); }
        .composer input:focus, .composer textarea:focus { outline: none; border-color: var(--primary); background: var(--input-bg); }
        .composer .composer-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
        .btn {
            padding: 10px 28px;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            color: #fff;
            background: var(--primary);
            transition: all .2s;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        /* ---- 推荐关注社交卡（关注流 2/5/8 位插入）+ 三态关注按钮 ---- */
        .recommend-card { display: flex; align-items: center; gap: 10px; padding: 12px 16px; margin-bottom: 12px; background: var(--composer-bg); border: 1px solid var(--border); border-radius: 12px; }
        .recommend-card .recommend-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--primary); color: #fff; font-weight: 700; flex-shrink: 0; }
        .recommend-card .recommend-info { flex: 1; min-width: 0; }
        .recommend-card .recommend-name { font-weight: 600; color: var(--text-heading); }
        .recommend-card .recommend-reason { font-size: 12px; color: var(--muted-2); }
        .recommend-card .follow-btn { padding: 4px 14px; font-size: 13px; }
        .follow-btn.following { background: transparent; border: 1px solid var(--border); color: var(--muted-2); }
        .follow-btn.following .follow-hover { display: none; }
        .follow-btn.following:hover { border-color: #ff4d4f; color: #ff4d4f; background: rgba(255, 77, 79, 0.06); }
        .follow-btn.following:hover .follow-text { display: none; }
        .follow-btn.following:hover .follow-hover { display: inline; }
        /* ---- 帖子列表（微博式信息流） ---- */
        .feed-title { display: flex; align-items: center; gap: 8px; margin: 8px 0 16px; color: var(--text-heading); font-size: 18px; font-weight: 700; }
        .feed-refresh {
            margin-left: auto; border: none; background: none; cursor: pointer;
            font-size: 16px; color: var(--muted); transition: transform .3s;
        }
        .feed-refresh:hover { color: var(--primary); transform: rotate(180deg); }
        .feed-tabs { display: flex; gap: 8px; }
        .feed-tab {
            border: 1px solid var(--border); background: var(--card-bg); color: var(--muted-2);
            font-size: 13px; padding: 6px 14px; border-radius: 16px; cursor: pointer; transition: all .2s;
        }
        .feed-tab:hover { border-color: var(--primary); color: var(--primary); }
        .feed-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        /* 新微博提示条 + 新卡片高亮（仿微博增量刷新） */
        .new-post-bar {
            background: var(--primary); color: #fff; text-align: center; padding: 9px 0;
            border-radius: 10px; cursor: pointer; font-size: 13px; margin-bottom: 14px;
            box-shadow: 0 2px 10px var(--primary-ring); transition: all .2s;
        }
        .new-post-bar:hover { opacity: 0.9; }
        .post.new-post { animation: newPostFlash 2.2s ease; }
        @keyframes newPostFlash { 0% { background: rgba(255, 130, 0, 0.18); } 100% { background: var(--card-bg); } }
        .post {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 12px var(--shadow-card);
            padding: 20px 24px;
            margin-bottom: 16px;
            transition: background .3s;
        }
        .post .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .post .avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 600;
            flex-shrink: 0;
        }
        .post .post-author { font-size: 15px; font-weight: 600; color: var(--text-heading); }
          .post .avatar-link { text-decoration: none; display: inline-flex; }
          .post .avatar-link:hover .avatar { opacity: 0.85; }
          .post .author-link { text-decoration: none; }
          .post .author-link:hover .post-author { color: var(--primary); }
        .post .post-time { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .post .post-title { font-size: 16px; font-weight: 600; color: var(--text-heading); margin-bottom: 8px; }
        .post .post-title-link { color: var(--text-heading); text-decoration: none; }
        .post .post-title-link:hover { color: var(--primary); text-decoration: underline; }
        .post .post-detail-link { font-size: 13px; color: var(--primary); text-decoration: none; }
        .post .post-detail-link:hover { text-decoration: underline; }
        .post .post-content {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 12px;
        }
        .post .post-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border-row);
            padding-top: 10px;
        }
        .post .post-id { font-size: 12px; color: var(--muted); }
        .pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
        .pagination button {
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--card-bg);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            transition: all .2s;
        }
        .pagination button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
        .pagination button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .pagination .page-info { font-size: 13px; color: var(--muted); }
        .empty { text-align: center; color: var(--muted); padding: 40px 0; }
        .loading { text-align: center; color: var(--muted); padding: 20px; }
        /* 弹窗 */
        .modal-mask {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-mask.show { display: flex; }
        .modal {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            width: 640px;
            max-width: 92%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            transition: background .3s;
        }
        .modal h3 { font-size: 18px; color: var(--text-heading); margin-bottom: 16px; }
        .modal .form-group { margin-bottom: 12px; display: flex; flex-direction: column; }
        .modal .form-group label { font-size: 13px; color: var(--muted-2); margin-bottom: 4px; }
        .modal .form-group input {
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background: var(--input-bg);
            color: var(--text);
        }
        .modal .form-group input:focus { outline: none; border-color: var(--primary); }
        .modal .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border-row); font-size: 14px; }
        th { background: var(--composer-bg); font-weight: 600; color: var(--muted-2); }
        .btn-sm { padding: 4px 12px; font-size: 13px; border-radius: 6px; }
        .btn-warning { background: #faad14; }
        .btn-warning:hover { background: #d9940f; }
        .btn-danger { background: #ff4d4f; }
        .btn-danger:hover { background: #e03a3c; }
        .btn-success { background: #52c41a; }
        .btn-success:hover { background: #43a813; }
        .btn-cancel { background: var(--composer-bg); color: var(--muted-2); border: 1px solid var(--border); }
        .btn-cancel:hover { background: var(--border-row); }
        .actions { display: flex; gap: 6px; }
        .toast {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #333;
            color: #fff;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: all .3s;
            z-index: 999;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.error { background: #ff4d4f; }
        .toast.success { background: #52c41a; }
        .fade-in { animation: fadeIn .4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .topic-chip {
            display: inline-block; color: var(--primary); cursor: pointer;
            background: var(--tag-bg); border-radius: 4px; padding: 0 4px;
            font-weight: 600; transition: all .2s;
        }
        .topic-chip:hover { opacity: .8; }
        .post-repost-source {
            font-size: 13px; color: var(--muted); background: var(--composer-bg);
            border-radius: 8px; padding: 8px 10px; margin: 8px 0;
            border-left: 3px solid var(--primary);
        }
        .post-repost-source a { color: var(--primary); text-decoration: none; }
        /* 转发泡：内嵌原帖灰框（仿微博） */
        .repost-bubble {
            background: var(--composer-bg); border: 1px solid var(--border-row); border-radius: 10px;
            padding: 10px 14px; margin: 10px 0; cursor: pointer; transition: all .2s;
        }
        .repost-bubble:hover { border-color: var(--primary); }
        .repost-bubble-head { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
        .repost-bubble-title { font-size: 14px; font-weight: 600; color: var(--text-heading); margin-bottom: 2px; }
        .repost-bubble-content {
            font-size: 13px; color: var(--muted-2); line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .post-reason {
            font-size: 12px; color: var(--primary); background: rgba(255, 82, 82, .08);
            border-radius: 6px; padding: 4px 8px; margin: 6px 0; display: inline-block;
        }
        .dislike-btn {
            border: none; background: transparent; color: var(--muted);
            font-size: 15px; cursor: pointer; padding: 2px 4px; border-radius: 6px;
        }
        .dislike-btn:hover { color: var(--danger, #e5484d); background: rgba(229, 72, 77, .1); }
        .user-result-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .user-result-item {
            display: inline-block; padding: 6px 12px; border-radius: 16px;
            background: var(--composer-bg); color: var(--muted-2); font-size: 13px;
            text-decoration: none; transition: all .2s; border: 1px solid var(--border);
        }
        .user-result-item:hover { border-color: var(--primary); color: var(--primary); }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="navbar">
        <div class="brand">📢 动态广场</div>
        <div class="navbar-search">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索帖子/用户/话题..."
                       onkeydown="if(event.key==='Enter')doSearch()">
                <button class="btn btn-sm btn-search" onclick="doSearch()">🔍 搜索</button>
                <button class="btn btn-sm btn-cancel" id="clearSearchBtn" style="display:none;" onclick="clearSearch()">清除</button>
            </div>
        </div>
        <div class="nav-right">
            <a class="nav-link" href="/quote.html">💡 灵感</a>
            <a class="nav-link" href="/wheel.html">🎡 转盘</a>
            <span id="navAuthLinks">
                <a class="nav-link" href="/my.html">📝 我的文章</a>
                <a class="nav-link" href="/message.html">💬 私信<span class="nav-badge" id="msgBadge" style="display:none;">0</span></a>
                <a class="nav-link" href="/notification.html">🔔 通知<span class="nav-badge" id="navBadge" style="display:none;">0</span></a>
                <a class="nav-link btn-user" id="userAdminLink" href="javascript:void(0)" onclick="openUserModal()">👥 用户管理</a>
            </span>
            <a class="username-tag" href="/my.html" title="我的主页">👤 <b id="currentUser"></b></a>
            <button class="login-btn" id="loginBtn" style="display:none;" onclick="location.href='/login.html'">登录 / 注册</button>
            <button class="theme-toggle" id="themeToggle" title="切换主题" onclick="toggleTheme()">🌙</button>
            <button class="logout-btn" id="logoutBtn" onclick="logout()">退出</button>
        </div>
    </div>

    <div class="container">
        <!-- 左栏：帖子分类导航 -->
        <aside class="side-left">
            <div class="side-card">
                <h3>📂 帖子分类</h3>
                <ul class="cat-list" id="catList"><li>加载中...</li></ul>
            </div>
        </aside>
        <!-- 中栏：发帖 + 信息流 -->
        <main class="main-center">
        <!-- 发帖框（微博式，显眼，仅文字动态） -->
        <div class="composer">
            <div class="composer-title">
                <span>✍️ 有什么新鲜事想分享？</span>
                <a href="/post.html" class="article-entry">📝 发表文章</a>
            </div>
            <div id="guestPrompt" style="display:none;" class="guest-prompt">
                🔒 <b>登录后即可发布动态、点赞评论</b>
                <a href="/login.html" class="guest-login-link">去登录 / 注册 →</a>
            </div>
            <div id="composerEditor">
                <textarea id="postContent" maxlength="5000" placeholder="分享你的想法、动态..." oninput="updateComposerCount()"></textarea>
                <div class="composer-actions">
                    <span id="composerCount" class="composer-count"></span>
                    <button class="btn" id="publishBtn" onclick="publishPost()" disabled>🚀 发布</button>
                </div>
            </div>
        </div>

        <!-- 帖子信息流 -->
        <div class="feed-title">
            <div class="feed-tabs">
                <button class="feed-tab active" id="tabLatest" onclick="switchFeed('latest')">📚 最新</button>
                <button class="feed-tab" id="tabFollow" onclick="switchFeed('follow')">🔥 关注</button>
                <button class="feed-tab" id="tabHot" onclick="switchFeed('hot')">🏆 热门</button>
                <button class="feed-tab" id="tabRecommend" onclick="switchFeed('recommend')">✨ 推荐</button>
            </div>
            <button class="feed-refresh" onclick="refreshFeed()" title="刷新信息流">🔄</button>
        </div>
        <div id="userResult"></div>
        <div id="loading" class="loading">加载中...</div>
        <div id="newPostBar" class="new-post-bar" style="display:none;" onclick="loadNewPosts()">有新动态，点击查看</div>
        <div id="postList"></div>
        <div id="pagination" class="pagination"></div>
        </main>

        <!-- 右栏：微博热搜 + 热门帖子 -->
        <aside class="side-right">
            <div class="side-card">
                <div class="side-card-head">
                    <h3>🔥 微博热搜</h3>
                    <button class="hot-refresh" onclick="loadHotSearches()" title="刷新">🔄</button>
                </div>
                <ul class="hot-search-list" id="hotSearchList"><li>加载中...</li></ul>
                <div class="hot-more"><a href="/hot.html">展开完整榜单 →</a></div>
            </div>
            <div class="side-card">
                <h3>🏆 热门帖子</h3>
                <ul class="hot-list" id="hotPostList"><li>加载中...</li></ul>
            </div>
        </aside>
    </div>

    <!-- 用户管理弹窗 -->
    <div class="modal-mask" id="userModal">
        <div class="modal">
            <h3>👥 用户管理</h3>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="createUsername" placeholder="用户名">
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="createEmail" placeholder="user@example.com">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="createPassword" placeholder="6-20位">
            </div>
            <div class="form-group">
                <label>年龄</label>
                <input type="number" id="createAge" placeholder="年龄">
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeUserModal()">关闭</button>
                <button class="btn btn-success btn-sm" onclick="createUser()">➕ 添加用户</button>
            </div>
            <div style="margin-top:16px; max-height:300px; overflow-y:auto;">
                <table>
                    <thead>
                        <tr><th>ID</th><th>用户名</th><th>邮箱</th><th>年龄</th><th>操作</th></tr>
                    </thead>
                    <tbody id="userBody"></tbody>
                </table>
                <div id="userEmpty" class="empty" style="display:none;">暂无用户</div>
            </div>
        </div>
    </div>

    <!-- 转发弹窗 -->
    <div class="modal-mask" id="repostModal">
        <div class="modal">
            <h3>🔄 转发动态</h3>
            <div class="form-group">
                <label>说说你的想法（选填）</label>
                <textarea id="repostContent" maxlength="500" placeholder="转发时想说点什么..."></textarea>
            </div>
            <label class="repost-as-comment"><input type="checkbox" id="repostAsComment"> 同时作为评论发表</label>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeRepostModal()">取消</button>
                <button class="btn" onclick="doRepost()">🔄 转发</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const POST_API = '/api/posts';
        const USER_API = '/api/users';

        // ---------- 工具 ----------
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show ' + (type || '');
            setTimeout(() => { toast.className = 'toast'; }, 2500);
        }
        // 大数字缩写：128500 -> 12.8万（仿微博计数展示）
        function formatCount(n) {
            n = parseInt(n || 0, 10);
            if (n >= 10000) {
                return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
            }
            return '' + n;
        }
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        function formatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            const pad = n => (n < 10 ? '0' + n : '' + n);
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
                + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }
        async function request(url, options) {
            const res = await fetch(url, options);
            let data = null;
            try { data = await res.json(); } catch (e) {}
            if (!res.ok) {
                if (res.status === 401) {
                    window.location.href = '/login.html';
                    throw new Error('请先登录');
                }
                let msg = '请求失败 (' + res.status + ')';
                if (data && data.message) msg = data.message;
                throw new Error(msg);
            }
            if (data && typeof data === 'object' && 'code' in data) {
                if (data.code !== 0) throw new Error(data.message || '请求失败');
                return data.data;
            }
            return data;
        }

        // ---------- 发动态（首页仅文字，无标题/分类/标签） ----------
        // 字数临界提示：>90% 变橙，满 5000 变红并禁用；空内容禁用发布（仿微博）
        function updateComposerCount() {
            const ta = document.getElementById('postContent');
            const countEl = document.getElementById('composerCount');
            const btn = document.getElementById('publishBtn');
            if (!ta || !countEl || !btn) return;
            const len = (ta.value || '').length;
            const max = 5000;
            btn.disabled = len === 0;
            if (len > max * 0.9) {
                countEl.textContent = (max - len) + ' / 5000';
                countEl.className = 'composer-count warn';
                if (len >= max) {
                    countEl.className = 'composer-count danger';
                    btn.disabled = true;
                }
            } else {
                countEl.textContent = '';
            }
        }
        let _publishKey = null; // 发帖幂等 key：首次点击生成，成功后清空，失败保留供重试（防双击/重试发重）
        async function publishPost() {
            const content = document.getElementById('postContent').value.trim();
            if (!content) { showToast('❌ 内容不能为空', 'error'); return; }
            const btn = document.getElementById('publishBtn');
            btn.disabled = true;
            if (!_publishKey) _publishKey = crypto.randomUUID();
            try {
                await request(POST_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Idempotency-Key': _publishKey },
                    body: JSON.stringify({ content, publish: true })
                });
                _publishKey = null;
                showToast('✅ 发布成功', 'success');
                document.getElementById('postContent').value = '';
                loadPosts();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            } finally {
                updateComposerCount();
            }
        }

        // ---------- 加载帖子信息流（分页 / 搜索 / 标签筛选） ----------
        let currentPage = 1;
        const PAGE_SIZE = 10;
        let searchKeyword = '';
        let activeTag = '';
        let activeCategory = '';
        let activeTopic = '';
        let feedType = 'latest';
        let isLoggedIn = false;
        let lastNewestId = 0;      // 已看到的最新帖子 ID（新微博轮询基准）
        let highlightAfterId = 0;  // 刷新后需高亮的帖子 ID 基准
        // 关注流游标分页状态（独立于 latest 的 lastNewestId，避免跨 Tab 污染）
        let followCursor = null;       // 下一页游标（页内最小 postId）
        let followHasMore = false;     // 是否还有更早的帖子（控制"加载更多"）
        let lastFollowNewestId = 0;    // 关注流已见最新帖 ID（since 增量轮询基准）
        async function loadPosts(page) {
            if (page) currentPage = page;
            const list = document.getElementById('postList');
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            try {
                let posts = [], total = 0, totalPages = 0;
                if (searchKeyword) {
                    const searchRes = await request('/api/search?keyword=' + encodeURIComponent(searchKeyword));
                    posts = (searchRes && searchRes.posts) || [];
                    total = posts.length;
                    totalPages = 1;
                    renderUserResults(searchRes ? searchRes.users : []);
                } else if (feedType === 'hot') {
                    posts = await request(POST_API + '/hot?limit=' + PAGE_SIZE) || [];
                    total = posts.length;
                    totalPages = 1;
                } else if (feedType === 'recommend') {
                    const data = await request('/api/recommend/feed?page=' + currentPage + '&size=' + PAGE_SIZE);
                    posts = (data.records || []).map(function (r) {
                        return Object.assign({}, r.post, { reason: r.reason, sources: r.sources, score: r.score });
                    });
                    total = data.total;
                    totalPages = data.totalPages;
                } else {
                    let url = POST_API + '?page=' + currentPage + '&size=' + PAGE_SIZE;
                    if (activeTag) url += '&tag=' + encodeURIComponent(activeTag);
                    if (activeCategory) url += '&category=' + encodeURIComponent(activeCategory);
                    if (activeTopic) url += '&topic=' + encodeURIComponent(activeTopic);
                    const data = await request(url);
                    posts = data.records || [];
                    total = data.total;
                    totalPages = data.totalPages;
                }
                list.innerHTML = '';
                if (!searchKeyword) document.getElementById('userResult').innerHTML = '';
                if (!posts || posts.length === 0) {
                    let emptyMsg = '还没有动态，快来发布第一条吧～';
                    if (searchKeyword) emptyMsg = '没有找到相关动态';
                    else if (activeTag) emptyMsg = '该标签下暂无动态';
                    else if (activeCategory) emptyMsg = '该分类下暂无动态';
                    else if (feedType === 'follow') emptyMsg = '你还没有关注任何人，快去关注感兴趣的博主吧～';
                    else if (feedType === 'hot') emptyMsg = '暂无热门帖子～';
                    else if (feedType === 'recommend') emptyMsg = '还没有推荐内容，去发帖/互动一下吧～';
                    list.innerHTML = '<div class="empty">' + emptyMsg + '</div>';
                } else {
                    appendPostCards(posts, false);
                    // 记录已见最新帖 ID，并清除本次高亮标记
                    if (posts && posts.length) {
                        const newest = Math.max.apply(null, posts.map(function (x) { return x.id; }));
                        lastNewestId = Math.max(lastNewestId, newest);
                    }
                    highlightAfterId = 0;
                }
                renderPagination(total, totalPages);
            } catch (e) {
                list.innerHTML = '<div class="empty">加载失败：' + escapeHtml(e.message) + '</div>';
                document.getElementById('pagination').innerHTML = '';
            } finally {
                loading.style.display = 'none';
            }
        }
        /** 渲染帖子卡片列表：append=true 追加，否则先清空（关注流 load-more 与各 feed 共用） */
        function appendPostCards(posts, append) {
            const list = document.getElementById('postList');
            if (!append) list.innerHTML = '';
            posts.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = 'post fade-in' + (highlightAfterId && p.id > highlightAfterId ? ' new-post' : '');
                div.style.animationDelay = (i * 0.05) + 's';
                const avatarChar = (p.author || '?').charAt(0).toUpperCase();
                div.innerHTML = `
                            <div class="post-header">
                                <a class="avatar-link" href="/user.html?id=${p.authorId}" title="${escapeHtml(p.author)}"><div class="avatar">${escapeHtml(avatarChar)}</div></a>
                                <div>
                                    <a class="author-link" href="/user.html?id=${p.authorId}"><div class="post-author">${escapeHtml(p.author)}</div></a>
                                    <div class="post-time">🕐 ${formatTime(p.createdAt)}</div>
                                </div>
                            </div>
                            ${p.title ? `<div class="post-title"><a class="post-title-link" href="/detail.html?id=${p.id}" ${feedType === 'recommend' ? 'onclick="track(\'CLICK\',' + p.id + ')"' : ''}>${escapeHtml(p.title)}</a></div>` : ''}
                            ${renderTags(p.tags)}
                            ${renderRepostBubble(p)}
                            ${p.reason ? `<div class="post-reason">🔍 ${escapeHtml(p.reason)}</div>` : ''}
                            ${renderPostContent(p)}
                            <div class="post-footer">
                                <span class="post-id">#${p.id}</span>
                                <div class="post-actions">
                                    <button class="like-btn${p.likedByMe ? ' liked' : ''}" data-count="${p.likeCount || 0}" onclick="toggleLike(${p.id}, this)">❤️ <span class="like-num">${formatCount(p.likeCount || 0)}</span></button>
                                    <button class="repost-btn" onclick="openRepostModal(${p.id})" title="转发">🔄 <span>${formatCount(p.repostCount || 0)}</span></button>
                                    <span class="stat-link">👁 ${formatCount(p.viewCount || 0)}</span>
                                      <a class="stat-link" href="/detail.html?id=${p.id}">💬 ${formatCount(p.commentCount || 0)}</a>
                                    <a class="post-detail-link" href="/detail.html?id=${p.id}" ${feedType === 'recommend' ? 'onclick="track(\'CLICK\',' + p.id + ')"' : ''}>📖 查看全文</a>
                                    ${feedType === 'recommend' ? '<button class="dislike-btn" onclick="dislikePost(' + p.id + ', this)" title="不感兴趣">🙅</button>' : ''}
                                </div>
                            </div>`;
                list.appendChild(div);
            });
            highlightAfterId = 0;
        }
        /** 关注流游标加载：reset=true 回到第一页，否则用 followCursor 加载更早一页 */
        async function loadFollowFeed(reset) {
            if (reset) {
                followCursor = null;
                followHasMore = false;
            }
            const list = document.getElementById('postList');
            const loading = document.getElementById('loading');
            const paginationBox = document.getElementById('pagination');
            loading.style.display = 'block';
            try {
                let url = '/api/follows/feed?size=' + PAGE_SIZE;
                if (followCursor) url += '&max_id=' + followCursor;
                const data = await request(url);
                const posts = data.records || [];
                if (reset) list.innerHTML = '';
                if (!posts || posts.length === 0) {
                    if (reset) list.innerHTML = '<div class="empty">你还没有关注任何人，快去关注感兴趣的博主吧～</div>';
                } else {
                    appendPostCards(posts, !reset);
                    const newest = Math.max.apply(null, posts.map(function (x) { return x.id; }));
                    lastFollowNewestId = Math.max(lastFollowNewestId, newest);
                    followCursor = data.nextMaxId || null;
                    followHasMore = !!data.hasMore;
                }
                // 首页（reset）插入推荐关注社交卡（第 2/5/8 位），加载更多不重复插
                if (reset) await insertRecommendCards();
                // "加载更多"按钮：仅关注流且还有更早时展示
                paginationBox.innerHTML = '';
                if (followHasMore) {
                    const btn = document.createElement('button');
                    btn.className = 'page-btn';
                    btn.textContent = '加载更多 ⬇';
                    btn.onclick = function () { loadFollowFeed(false); };
                    paginationBox.appendChild(btn);
                }
            } catch (e) {
                list.innerHTML = '<div class="empty">加载失败：' + escapeHtml(e.message) + '</div>';
                paginationBox.innerHTML = '';
            } finally {
                loading.style.display = 'none';
            }
        }
        /** 关注流首页插入推荐关注社交卡（第 2/5/8 位 = 0 基下标 1/4/7） */
        async function insertRecommendCards() {
            if (feedType !== 'follow') return; // 防 async 竞态：用户可能已切 Tab
            const list = document.getElementById('postList');
            const children = list.children;
            if (!children || children.length === 0) return;
            let recs = [];
            try {
                recs = await request('/api/follows/recommend?limit=3') || [];
            } catch (e) { return; }
            if (!recs.length) return;
            // 先保存目标槽位引用再逐个 insertBefore（list.children 是 live 集合，直接按索引插会漂移）
            const slots = [1, 4, 7];
            const refs = slots.map(function (s) { return children[s]; });
            recs.forEach(function (u, i) {
                const slot = slots[i];
                if (slot === undefined) return;
                const card = document.createElement('div');
                card.className = 'recommend-card';
                const avatarChar = (u.avatar || u.username || '?').charAt(0).toUpperCase();
                card.innerHTML =
                    '<a class="recommend-avatar" href="/user.html?id=' + u.id + '">' + escapeHtml(avatarChar) + '</a>' +
                    '<div class="recommend-info">' +
                        '<a class="recommend-name" href="/user.html?id=' + u.id + '">' + escapeHtml(u.username) + '</a>' +
                        '<div class="recommend-reason">' + escapeHtml(u.reason || '') + '</div>' +
                    '</div>' +
                    '<button class="btn follow-btn" onclick="toggleRecommendFollow(' + u.id + ', this)">➕ 关注</button>';
                const ref = refs[i];
                if (ref && ref.parentNode === list) {
                    list.insertBefore(card, ref);
                } else {
                    list.appendChild(card);
                }
            });
        }
        /** 社交卡关注按钮三态切换（参照 user.html toggleFollow，按 userId 独立，不整页刷新） */
        async function toggleRecommendFollow(userId, btn) {
            const following = btn.classList.contains('following');
            try {
                if (following) {
                    await request('/api/follows/' + userId, { method: 'DELETE' });
                    showToast('已取消关注', 'success');
                } else {
                    await request('/api/follows/' + userId, { method: 'POST' });
                    showToast('✅ 关注成功', 'success');
                }
                btn.className = 'btn follow-btn' + (!following ? ' following' : '');
                btn.innerHTML = !following
                    ? '<span class="follow-text">✔️ 已关注</span><span class="follow-hover">取消关注</span>'
                    : '➕ 关注';
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }
        function renderPagination(total, totalPages) {
            const box = document.getElementById('pagination');
            if (!total || totalPages <= 1) { box.innerHTML = ''; return; }
            let html = '<button class="page-btn" data-page="' + (currentPage - 1) + '" ' + (currentPage <= 1 ? 'disabled' : '') + '>‹ 上一页</button>';
            for (let i = 1; i <= totalPages; i++) {
                html += '<button class="page-btn' + (i === currentPage ? ' active' : '') + '" data-page="' + i + '">' + i + '</button>';
            }
            html += '<button class="page-btn" data-page="' + (currentPage + 1) + '" ' + (currentPage >= totalPages ? 'disabled' : '') + '>下一页 ›</button>';
            html += '<span class="page-info">共 ' + total + ' 条</span>';
            box.innerHTML = html;
            box.querySelectorAll('.page-btn').forEach(btn => {
                btn.addEventListener('click', function () {
                    if (this.disabled) return;
                    const target = parseInt(this.getAttribute('data-page'), 10);
                    if (target >= 1 && target <= totalPages) loadPosts(target);
                });
            });
        }

        // ---------- 标签 / 搜索 / 点赞 ----------
        function parseTags(str) {
            if (!str || !str.trim()) return [];
            return str.trim().split(/\s+/).filter(Boolean).slice(0, 5);
        }
        function renderTags(tags) {
            if (!tags || tags.length === 0) return '';
            return '<div class="post-tags">' + tags.map(function (t) {
                return '<span class="tag-chip" onclick="filterByTag(\'' + escapeHtml(t) + '\')">#' + escapeHtml(t) + '</span>';
            }).join('') + '</div>';
        }
        function filterByTag(tag) {
            activeTag = tag;
            activeTopic = '';
            searchKeyword = '';
            feedType = 'latest'; // 点标签聚合：切回"最新"Tab 使筛选生效
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearchBtn').style.display = 'none';
            updateTabActive();
            currentPage = 1;
            loadPosts(1);
        }
        function doSearch() {
            const kw = document.getElementById('searchInput').value.trim();
            searchKeyword = kw;
            activeTag = '';
            activeTopic = '';
            document.getElementById('clearSearchBtn').style.display = kw ? 'inline-block' : 'none';
            currentPage = 1;
            loadPosts(1);
        }
        function clearSearch() {
            searchKeyword = '';
            activeTag = '';
            activeTopic = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearchBtn').style.display = 'none';
            document.getElementById('userResult').innerHTML = '';
            currentPage = 1;
            loadPosts(1);
        }
        // ---------- 话题 / 用户搜索结果 / 转发 ----------
        function renderContent(text) {
            if (!text) return '';
            const escaped = escapeHtml(text);
            const withTopics = escaped.replace(/#([^#\s]{1,30})#/g, function (m, t) {
                return '<span class="topic-chip" onclick="filterByTopic(\'' + t + '\')">#' + t + '#</span>';
            });
            return withTopics.replace(/@([\w\u4e00-\u9fa5]{1,20})/g, function (m, u) {
                return '<a class="mention-link" href="/user.html?username=' + encodeURIComponent(u) + '">@' + u + '</a>';
            });
        }
        // \u8f6c\u53d1\u5e16\u5185\u5bb9 = \u8bc4\u8bed + "// \u8f6c\u53d1\u81ea..."\uff0c\u5361\u7247\u53ea\u5c55\u793a\u8bc4\u8bed\u90e8\u5206\uff08\u539f\u5e16\u8fdb\u8f6c\u53d1\u6ce1\uff09
        function repostComment(content) {
            const idx = content ? content.indexOf('// \u8f6c\u53d1\u81ea') : -1;
            return idx > 0 ? content.substring(0, idx).trim() : content;
        }
        function renderPostContent(p) {
            if (p.originalPostId) {
                return '<div class="post-content">' + renderContent(repostComment(p.content)) + '</div>';
            }
            return '<div class="post-content">' + renderContent(p.content) + '</div>';
        }
        // \u8f6c\u53d1\u6ce1\uff1a\u5185\u5d4c\u539f\u5e16\u7070\u6846\uff0c\u70b9\u51fb\u8df3\u539f\u535a\u8be6\u60c5\uff08\u4eff\u5fae\u535a\uff09
        function renderRepostBubble(p) {
            if (!p.originalPostId) return '';
            return '<div class="repost-bubble" onclick="location.href=\'/detail.html?id=' + p.originalPostId + '\'">' +
                '<div class="repost-bubble-head">\ud83d\udd01 @' + escapeHtml(p.originalAuthor || '') + ' \u7684\u539f\u5fae\u535a</div>' +
                (p.originalTitle ? '<div class="repost-bubble-title">' + escapeHtml(p.originalTitle) + '</div>' : '') +
                '<div class="repost-bubble-content">' + escapeHtml(p.originalContent || '') + '</div>' +
                '</div>';
        }
        function filterByTopic(topic) {
            activeTopic = topic;
            searchKeyword = '';
            activeTag = '';
            feedType = 'latest'; // 点 #话题# 聚合：切回"最新"Tab 使筛选生效
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearchBtn').style.display = 'none';
            document.getElementById('userResult').innerHTML = '';
            updateTabActive();
            currentPage = 1;
            loadPosts(1);
        }
        function renderUserResults(users) {
            const box = document.getElementById('userResult');
            if (!users || users.length === 0) { box.innerHTML = ''; return; }
            box.innerHTML = '<div class="side-card" style="margin-bottom:16px;"><h3>👥 相关用户</h3><div class="user-result-list">' +
                users.map(u => '<a class="user-result-item" href="/user.html?id=' + u.id + '">👤 <b>' + escapeHtml(u.username) + '</b></a>').join('') +
                '</div></div>';
        }
        let repostTargetId = null;
        function openRepostModal(id) {
            repostTargetId = id;
            // 预填"转发微博"，光标置于其后（仿微博转发弹窗）
            const ta = document.getElementById('repostContent');
            ta.value = '转发微博';
            ta.focus();
            ta.setSelectionRange(ta.value.length, ta.value.length);
            document.getElementById('repostAsComment').checked = false;
            document.getElementById('repostModal').classList.add('show');
        }
        function closeRepostModal() {
            document.getElementById('repostModal').classList.remove('show');
        }
        async function doRepost() {
            if (!repostTargetId) return;
            const content = document.getElementById('repostContent').value.trim();
            try {
                await request(POST_API + '/' + repostTargetId + '/repost', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content })
                });
                // 同时作为评论发表（仿微博）
                if (document.getElementById('repostAsComment') && document.getElementById('repostAsComment').checked) {
                    await request(POST_API + '/' + repostTargetId + '/comments', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: content || '转发微博' })
                    });
                }
                showToast('✅ 转发成功', 'success');
                closeRepostModal();
                loadPosts();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }
        async function loadMsgUnread() {
            try {
                const data = await request('/api/messages/unread-count');
                const badge = document.getElementById('msgBadge');
                const count = data.count || 0;
                if (count > 0) {
                    badge.textContent = count > 99 ? '99+' : count;
                    badge.style.display = 'inline-block';
                } else {
                    badge.style.display = 'none';
                }
            } catch (e) {}
        }
        // ---------- 信息流切换（最新 / 关注 / 热门 / 推荐） ----------
        function updateTabActive() {
            const map = { latest: 'tabLatest', follow: 'tabFollow', hot: 'tabHot', recommend: 'tabRecommend' };
            ['tabLatest', 'tabFollow', 'tabHot', 'tabRecommend'].forEach(function (id) {
                document.getElementById(id).className = 'feed-tab' + (id === map[feedType] ? ' active' : '');
            });
        }
        function switchFeed(type) {
            // 游客需登录才能看关注流 / 个性化推荐（参考微博首页）
            if ((type === 'follow' || type === 'recommend') && !isLoggedIn) {
                window.location.href = '/login.html';
                return;
            }
            feedType = type;
            searchKeyword = '';
            activeTag = '';
            activeCategory = '';
            activeTopic = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearchBtn').style.display = 'none';
            updateTabActive();
            if (type === 'follow') {
                // 关注流：游标分页 + 独立新帖基准（since 轮询）
                followCursor = null;
                followHasMore = false;
                lastFollowNewestId = 0;
                loadFollowFeed(true);
                return;
            }
            currentPage = 1;
            loadPosts(1);
        }
        // ---------- 推荐行为打点（点击 / 不感兴趣） ----------
        let _tracked = {};
        async function track(action, postId) {
            const key = postId + ':' + action;
            if (_tracked[key]) return; // 防抖：同 postId+action 只上报一次
            _tracked[key] = true;
            try {
                await request('/api/recommend/track', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ postId: postId, action: action })
                });
            } catch (e) {}
        }
        function dislikePost(postId, btn) {
            track('DISLIKE', postId);
            const card = btn.closest('.post');
            if (card) card.style.opacity = '0.35';
        }
        // ---------- 分类导航 ----------
        async function loadCategories() {
            try {
                const cats = await request('/api/categories');
                const box = document.getElementById('catList');
                if (!cats || cats.length === 0) { box.innerHTML = '<li>暂无分类</li>'; return; }
                box.innerHTML = cats.map(function (c) {
                    return '<li data-cat="' + escapeHtml(c.name) + '" onclick="filterByCategory(this)"><span>' + (c.icon || '') + '</span> ' + escapeHtml(c.name) + '<span class="cat-count">' + (c.count || 0) + '</span></li>';
                }).join('');
                // 分类页独立路由：/category/{key} 自动激活对应分类（可分享/收藏，刷新不丢状态）
                const CATEGORY_KEY_MAP = { tech: '科技', digital: '数码', game: '游戏', entertainment: '娱乐', sports: '体育', finance: '财经', auto: '汽车', news: '时事', edu: '教育', life: '生活', food: '美食', other: '其他' };
                const pathMatch = window.location.pathname.match(/^\/category\/([^/]+)/);
                if (pathMatch && CATEGORY_KEY_MAP[pathMatch[1]]) {
                    const name = CATEGORY_KEY_MAP[pathMatch[1]];
                    activeCategory = name;
                    document.querySelectorAll('#catList li').forEach(function (li) {
                        li.classList.toggle('active', li.getAttribute('data-cat') === name);
                    });
                    document.title = name + '分类 - MiniForum';
                }
            } catch (e) {}
        }
        function filterByCategory(el) {
            const name = el.getAttribute('data-cat');
            if (name === '全部动态') {
                activeCategory = '';
                document.querySelectorAll('#catList li').forEach(function (li) { li.classList.remove('active'); });
                document.querySelector('#catList li[data-cat="全部动态"]').classList.add('active');
            } else {
                activeCategory = name;
                document.querySelectorAll('#catList li').forEach(function (li) { li.classList.remove('active'); });
                el.classList.add('active');
            }
            searchKeyword = '';
            activeTag = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('clearSearchBtn').style.display = 'none';
            currentPage = 1;
            loadPosts(1);
        }
        // ---------- 微博热搜榜 ----------
        async function loadHotSearches() {
            try {
                const list = await request('/api/hot/search?limit=15');
                const box = document.getElementById('hotSearchList');
                if (!list || list.length === 0) { box.innerHTML = '<li>暂无热搜</li>'; return; }
                box.innerHTML = list.map(function (h) {
                    const rankClass = h.rank <= 3 ? ' hot-rank-top' : '';
                    const levelTag = h.level ? '<span class="hot-level lv-' + h.level + '">' + h.level + '</span>' : '';
                    let trend = '';
                    if (h.trend === 1) trend = '<span class="hot-trend up">↑</span>';
                    else if (h.trend === -1) trend = '<span class="hot-trend down">↓</span>';
                    else if (h.trend === 2) trend = '<span class="hot-trend new">新</span>';
                    return '<li onclick="location.href=\'/hot.html\'">' +
                        '<span class="hot-rank' + rankClass + '">' + h.rank + '</span>' +
                        '<span class="hot-word">' + escapeHtml(h.keyword) + '</span>' +
                        levelTag + trend +
                        '<span class="hot-heat">' + formatCount(h.heat) + '</span></li>';
                }).join('');
            } catch (e) {}
        }

        // ---------- 热门帖子榜 ----------
        async function loadHotPosts() {
            try {
                const list = await request(POST_API + '/hot?limit=10');
                const box = document.getElementById('hotPostList');
                if (!list || list.length === 0) { box.innerHTML = '<li>暂无热门</li>'; return; }
                box.innerHTML = list.map(function (p, idx) {
                    return '<li onclick="location.href=\'/detail.html?id=' + p.id + '\'"><span class="hot-rank' + (idx < 3 ? ' hot-rank-top' : '') + '">' + (idx + 1) + '</span><span><span class="hot-word">' + escapeHtml(p.title || (p.content || '').slice(0, 20)) + '</span><br><span class="hot-heat">👁 ' + formatCount(p.viewCount) + ' · ❤️ ' + formatCount(p.likeCount) + ' · 💬 ' + formatCount(p.commentCount) + '</span></span></li>';
                }).join('');
            } catch (e) {}
        }

        // ---------- 通知未读数角标 ----------
        async function loadUnreadCount() {
            try {
                const data = await request('/api/notifications/unread-count');
                const badge = document.getElementById('navBadge');
                const count = data.count || 0;
                if (count > 0) {
                    badge.textContent = count > 99 ? '99+' : count;
                    badge.style.display = 'inline-block';
                } else {
                    badge.style.display = 'none';
                }
            } catch (e) {}
        }
        async function toggleLike(id, btn) {
            const liked = btn.classList.contains('liked');
            const numEl = btn.querySelector('.like-num');
            const orig = parseInt(btn.getAttribute('data-count') || '0', 10) || 0;
            const next = Math.max(0, orig + (liked ? -1 : 1));
            // 乐观更新：先变 UI，接口失败再回滚
            btn.classList.toggle('liked');
            btn.setAttribute('data-count', next);
            if (numEl) numEl.textContent = formatCount(next);
            btn.classList.remove('like-pop');
            void btn.offsetWidth;
            btn.classList.add('like-pop');
            try {
                const method = liked ? 'DELETE' : 'POST';
                const data = await request(POST_API + '/' + id + '/like', { method: method });
                if (data && typeof data.likeCount !== 'undefined') {
                    btn.setAttribute('data-count', data.likeCount);
                    if (numEl) numEl.textContent = formatCount(data.likeCount);
                }
            } catch (e) {
                btn.classList.toggle('liked');
                btn.setAttribute('data-count', orig);
                if (numEl) numEl.textContent = formatCount(orig);
                showToast('❌ ' + e.message, 'error');
            }
        }

        // ---------- 用户管理 ----------
        function openUserModal() {
            document.getElementById('userModal').classList.add('show');
            loadUsers();
        }
        function closeUserModal() {
            document.getElementById('userModal').classList.remove('show');
        }
        document.getElementById('userModal').addEventListener('click', function (e) {
            if (e.target === this) closeUserModal();
        });
        async function loadUsers() {
            const body = document.getElementById('userBody');
            const empty = document.getElementById('userEmpty');
            try {
                const users = await request(USER_API);
                body.innerHTML = '';
                if (!users || users.length === 0) {
                    empty.style.display = 'block';
                } else {
                    empty.style.display = 'none';
                    users.forEach(u => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${u.id}</td>
                            <td>${escapeHtml(u.username)}</td>
                            <td>${escapeHtml(u.email)}</td>
                            <td>${u.age}</td>
                            <td><div class="actions">
                                <button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id})">删除</button>
                            </div></td>`;
                        body.appendChild(tr);
                    });
                }
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }
        async function createUser() {
            const username = document.getElementById('createUsername').value.trim();
            const email = document.getElementById('createEmail').value.trim();
            const password = document.getElementById('createPassword').value;
            const age = parseInt(document.getElementById('createAge').value, 10);
            if (!username || !email || !password) { showToast('❌ 请填写用户名/邮箱/密码', 'error'); return; }
            try {
                await request(USER_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, age })
                });
                showToast('✅ 添加成功', 'success');
                document.getElementById('createUsername').value = '';
                document.getElementById('createEmail').value = '';
                document.getElementById('createPassword').value = '';
                document.getElementById('createAge').value = '';
                loadUsers();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }
        async function deleteUser(id) {
            if (!confirm('确定要删除用户 ID=' + id + ' 吗？')) return;
            try {
                await request(USER_API + '/' + id, { method: 'DELETE' });
                showToast('🗑️ 删除成功', 'success');
                loadUsers();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        // ---------- 新微博提示条（仿微博：增量刷新不打断） ----------
        async function checkNewPosts() {
            try {
                if (feedType === 'latest') {
                    const data = await request(POST_API + '?page=1&size=1');
                    const newest = data && data.records && data.records[0];
                    if (!newest || newest.id <= lastNewestId) return;
                    // 统计新微博条数
                    const countData = await request(POST_API + '?page=1&size=50');
                    let n = 0;
                    (countData.records || []).forEach(function (p) { if (p.id > lastNewestId) n++; });
                    const bar = document.getElementById('newPostBar');
                    bar.innerHTML = '有 <b>' + n + '</b> 条新微博，点击查看';
                    bar.style.display = 'block';
                } else if (feedType === 'follow') {
                    // 关注流增量：since_id = 已见最新帖 id（严格大于，天然不重不漏）
                    if (lastFollowNewestId <= 0) return;
                    const data = await request('/api/follows/feed?since_id=' + lastFollowNewestId + '&size=50');
                    const posts = data.records || [];
                    if (!posts.length) return;
                    const bar = document.getElementById('newPostBar');
                    // 命中 50 上限时条数可能被截断，退化为不带数字的文案
                    bar.innerHTML = posts.length >= 50
                        ? '有新的关注动态，点击查看'
                        : '有 <b>' + posts.length + '</b> 条新关注动态，点击查看';
                    bar.style.display = 'block';
                }
            } catch (e) {}
        }
        async function loadNewPosts() {
            document.getElementById('newPostBar').style.display = 'none';
            if (feedType === 'follow') {
                highlightAfterId = lastFollowNewestId;
                loadFollowFeed(true);
                return;
            }
            highlightAfterId = lastNewestId;
            currentPage = 1;
            loadPosts(1);
        }
        // 手动刷新：回到当前 feed 第一页 + 刷新右栏热搜/热门
        function refreshFeed() {
            document.getElementById('newPostBar').style.display = 'none';
            if (feedType === 'follow') {
                loadFollowFeed(true);
            } else {
                currentPage = 1;
                loadPosts(1);
            }
            loadHotSearches();
            loadHotPosts();
        }

        // ---------- 登录校验（游客模式：可浏览热门/最新，弱化登录入口） ----------
        async function checkLogin() {
            let username = '游客';
            let isAdmin = false;
            try {
                const res = await fetch('/api/auth/me');
                const data = await res.json();
                if (res.ok && data.code === 0) {
                    isLoggedIn = true;
                    username = data.data.username;
                    isAdmin = (username === 'admin');
                }
            } catch (e) {}
            document.getElementById('currentUser').textContent = username;
            document.getElementById('loginBtn').style.display = isLoggedIn ? 'none' : 'inline-block';
            document.getElementById('logoutBtn').style.display = isLoggedIn ? 'inline-block' : 'none';
            document.getElementById('navAuthLinks').style.display = isLoggedIn ? '' : 'none';
            document.getElementById('userAdminLink').style.display = isLoggedIn && isAdmin ? '' : 'none';
            document.getElementById('guestPrompt').style.display = isLoggedIn ? 'none' : '';
            document.getElementById('composerEditor').style.display = isLoggedIn ? '' : 'none';
            if (!isLoggedIn) {
                feedType = 'hot'; // 游客默认看热门（参考微博首页）
                updateTabActive();
            } else {
                loadUnreadCount();
                loadMsgUnread();
            }
            loadCategories();
            loadHotSearches();
            loadHotPosts();
            loadPosts();
        }
        async function logout() {
            try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (e) {}
            window.location.href = '/login.html';
        }
        checkLogin();
        // 每 15 秒轮询私信未读数
        setInterval(loadMsgUnread, 15000);
        // 每 30 秒轮询新微博（增量刷新提示条）
        setInterval(checkNewPosts, 30000);

        // ---------- 主题切换 ----------
        function updateToggleIcon() {
            const theme = document.documentElement.getAttribute('data-theme');
            document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateToggleIcon();
        }
        updateToggleIcon();
    </script>
</body>
</html>
