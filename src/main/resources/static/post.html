<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发帖广场</title>
    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        :root, [data-theme="light"] {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #333333;
            --text-heading: #1a1a2e;
            --muted: #999999;
            --muted-2: #666666;
            --border: #d9d9d9;
            --border-row: #f0f0f0;
            --primary: #4a7cff;
            --primary-hover: #3a66e0;
            --shadow: rgba(0,0,0,0.08);
            --input-bg: #ffffff;
            --tag-bg: #eef2ff;
            --tag-text: #4a7cff;
        }
        [data-theme="dark"] {
            --bg: #1a1a2e;
            --card-bg: #24243e;
            --text: #e4e4e4;
            --text-heading: #ffffff;
            --muted: #8f8fa8;
            --muted-2: #a8a8c0;
            --border: #3a3a5c;
            --border-row: #33334f;
            --primary: #5a8cff;
            --primary-hover: #6f9bff;
            --shadow: rgba(0,0,0,0.4);
            --input-bg: #2c2c4a;
            --tag-bg: #2e3a5c;
            --tag-text: #8fb0ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 30px 20px;
            transition: background .3s, color .3s;
        }
        .container { max-width: 760px; margin: 0 auto; }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px var(--shadow);
            transition: all .3s;
            z-index: 10;
        }
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--card-bg);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 8px var(--shadow);
            text-decoration: none;
            transition: all .3s;
            z-index: 10;
        }
        .back-btn:hover, .theme-toggle:hover { border-color: var(--primary); }
        h1 { text-align: center; color: var(--text-heading); font-size: 28px; margin-bottom: 24px; }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow);
            padding: 24px;
            margin-bottom: 20px;
            transition: background .3s;
        }
        .card h2 { font-size: 17px; color: var(--text-heading); margin-bottom: 14px; }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background: var(--input-bg);
            color: var(--text);
            transition: border-color .2s, background .3s, color .3s;
        }
        input[type="text"] { margin-bottom: 10px; }
        textarea { min-height: 120px; resize: vertical; }
        input:focus, textarea:focus { outline: none; border-color: var(--primary); }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            cursor: pointer;
            color: #fff;
            background: var(--primary);
            transition: all .2s;
            margin-top: 12px;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        /* 帖子列表 */
        .post {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow);
            padding: 20px 24px;
            margin-bottom: 16px;
            transition: background .3s;
        }
        .post .post-title { font-size: 17px; font-weight: 600; color: var(--text-heading); margin-bottom: 8px; }
        .post .post-content {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 12px;
        }
        .post .post-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--muted);
            border-top: 1px solid var(--border-row);
            padding-top: 10px;
        }
        .post .author-tag {
            background: var(--tag-bg);
            color: var(--tag-text);
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 500;
        }
        .empty { text-align: center; color: var(--muted); padding: 30px 0; }
        .loading { text-align: center; color: var(--muted); padding: 20px; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: opacity .3s;
            z-index: 20;
        }
        .toast.show { opacity: 1; }
        .fade-in { animation: fadeIn .4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <a class="back-btn" href="/index.html">← 返回</a>
    <button class="theme-toggle" id="themeToggle" title="切换主题" onclick="toggleTheme()">🌙</button>
    <div class="container">
        <h1>📝 发帖广场</h1>

        <div class="card">
            <h2>✍️ 发布新帖</h2>
            <input type="text" id="postTitle" maxlength="100" placeholder="标题">
            <textarea id="postContent" maxlength="5000" placeholder="分享你的想法..."></textarea>
            <button class="btn" id="publishBtn" onclick="publishPost()">🚀 发布</button>
        </div>

        <h2 style="color:var(--text-heading);font-size:17px;margin-bottom:14px;">📚 全部帖子</h2>
        <div id="postList"></div>
        <div id="loading" class="loading">加载中...</div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        const API = '/api/posts';

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            const pad = n => (n < 10 ? '0' + n : '' + n);
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
                + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        async function request(url, options) {
            const res = await fetch(url, options);
            const data = await res.json();
            if (!res.ok || data.code !== 0) {
                throw new Error(data.message || '请求失败');
            }
            return data.data;
        }

        // 发布帖子
        async function publishPost() {
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            if (!title) { showToast('❌ 标题不能为空'); return; }
            if (!content) { showToast('❌ 内容不能为空'); return; }
            const btn = document.getElementById('publishBtn');
            btn.disabled = true;
            try {
                await request(API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content })
                });
                showToast('✅ 发布成功');
                document.getElementById('postTitle').value = '';
                document.getElementById('postContent').value = '';
                loadPosts();
            } catch (e) {
                showToast('❌ ' + e.message);
            } finally {
                btn.disabled = false;
            }
        }

        // 加载帖子列表
        async function loadPosts() {
            const list = document.getElementById('postList');
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            try {
                const posts = await request(API);
                list.innerHTML = '';
                if (!posts || posts.length === 0) {
                    list.innerHTML = '<div class="empty">暂无帖子，快来发布第一条吧～</div>';
                } else {
                    posts.forEach((p, i) => {
                        const div = document.createElement('div');
                        div.className = 'post fade-in';
                        div.style.animationDelay = (i * 0.05) + 's';
                        div.innerHTML = `
                            <div class="post-title">${escapeHtml(p.title)}</div>
                            <div class="post-content">${escapeHtml(p.content)}</div>
                            <div class="post-meta">
                                <span class="author-tag">👤 ${escapeHtml(p.author)}</span>
                                <span>🕐 ${formatTime(p.createdAt)}</span>
                            </div>`;
                        list.appendChild(div);
                    });
                }
            } catch (e) {
                list.innerHTML = '<div class="empty">加载失败：' + escapeHtml(e.message) + '</div>';
            } finally {
                loading.style.display = 'none';
            }
        }

        // 登录校验
        async function checkLogin() {
            try {
                const res = await fetch('/api/auth/me');
                const data = await res.json();
                if (!res.ok || data.code !== 0) {
                    window.location.href = '/login.html';
                    return;
                }
                loadPosts();
            } catch (e) {
                window.location.href = '/login.html';
            }
        }
        checkLogin();

        // ---------- 主题切换 ----------
        function updateToggleIcon() {
            const theme = document.documentElement.getAttribute('data-theme');
            document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateToggleIcon();
        }
        updateToggleIcon();
    </script>
</body>
</html>
