<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态广场 - 登录</title>
    <script>
        // 防闪烁：在渲染前根据 localStorage 或系统偏好设置主题
        (function () {
            var saved = localStorage.getItem('theme');
            var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        :root, [data-theme="light"] {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #333333;
            --text-heading: #1a1a2e;
            --muted: #999999;
            --muted-2: #666666;
            --border: #d9d9d9;
            --primary: #4a7cff;
            --primary-hover: #3a66e0;
            --primary-ring: rgba(74,124,255,0.15);
            --shadow: rgba(0,0,0,0.1);
            --hint-bg: #f6ffed;
            --hint-border: #b7eb8f;
            --hint-text: #389e0d;
            --hint-code-bg: #e6fffb;
        }
        [data-theme="dark"] {
            --bg: #1a1a2e;
            --card-bg: #24243e;
            --text: #e4e4e4;
            --text-heading: #ffffff;
            --muted: #8f8fa8;
            --muted-2: #a8a8c0;
            --border: #3a3a5c;
            --primary: #5a8cff;
            --primary-hover: #6f9bff;
            --primary-ring: rgba(90,140,255,0.25);
            --shadow: rgba(0,0,0,0.4);
            --hint-bg: #1d3a2d;
            --hint-border: #2e5a44;
            --hint-text: #7ecb5f;
            --hint-code-bg: #2a3a52;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .3s, color .3s;
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px var(--shadow);
            transition: background .3s, color .3s, border-color .3s;
            z-index: 10;
        }
        .theme-toggle:hover { border-color: var(--primary); }
        .login-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px var(--shadow);
            padding: 40px;
            width: 380px;
            max-width: 90%;
            transition: background .3s;
        }
        .login-card h1 {
            text-align: center;
            font-size: 24px;
            color: var(--text-heading);
            margin-bottom: 8px;
        }
        .login-card .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 28px;
        }
        .mode-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
        .mode-tab {
            flex: 1; padding: 9px; border: 1px solid var(--border);
            background: var(--card-bg); color: var(--muted-2); border-radius: 6px;
            font-size: 14px; cursor: pointer; transition: all .2s;
        }
        .mode-tab:hover { border-color: var(--primary); color: var(--primary); }
        .mode-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; color: var(--muted-2); margin-bottom: 6px; }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background: var(--card-bg);
            color: var(--text);
            transition: border-color .2s, background .3s, color .3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-ring);
        }
        .btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: all .2s;
            color: #fff;
            background: var(--primary);
        }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-msg {
            color: #ff4d4f;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
            min-height: 18px;
        }
        .hint {
            margin-top: 20px;
            padding: 10px 14px;
            background: var(--hint-bg);
            border: 1px solid var(--hint-border);
            border-radius: 6px;
            font-size: 12px;
            color: var(--hint-text);
        }
        .hint code { background: var(--hint-code-bg); padding: 1px 4px; border-radius: 3px; }
        .guest-entry { text-align: center; margin-top: 20px; }
        .guest-entry a { font-size: 17px; color: var(--primary); text-decoration: none; font-weight: 700; }
        .guest-entry a:hover { text-decoration: underline; opacity: 0.85; }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" title="切换主题" onclick="toggleTheme()">🌙</button>
    <div class="login-card">
        <h1 id="cardTitle">欢迎回来 👋</h1>
        <div class="subtitle" id="cardSubtitle">登录「动态广场」，分享你的新鲜事</div>
        <div class="mode-tabs">
            <button class="mode-tab active" id="tabLogin" onclick="switchMode('login')">登 录</button>
            <button class="mode-tab" id="tabRegister" onclick="switchMode('register')">注 册</button>
        </div>

        <!-- 登录表单 -->
        <form id="loginForm">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" required autocomplete="username" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" required autocomplete="current-password" placeholder="请输入密码">
            </div>
            <button type="submit" class="btn" id="loginBtn">登 录</button>
        </form>

        <!-- 注册表单 -->
        <form id="registerForm" style="display:none;">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="regUsername" required placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label>密码（6-20 位）</label>
                <input type="password" id="regPassword" required placeholder="请输入密码">
            </div>
            <button type="submit" class="btn" id="registerBtn">注 册</button>
        </form>

        <div class="error-msg" id="errorMsg"></div>
        <div class="hint">💡 默认管理员账号：<code>admin</code> / <code>admin123</code></div>
        <div class="guest-entry"><a href="/index.html">随便逛逛 →</a></div>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('loginBtn');
            errorMsg.textContent = '';
            btn.disabled = true;
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.message || '登录失败');
                }
                window.location.href = '/index.html';
            } catch (e) {
                errorMsg.textContent = '❌ ' + e.message;
                btn.disabled = false;
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            login();
        });

        // ---------- 登录 / 注册 切换 ----------
        function switchMode(mode) {
            const isLogin = mode === 'login';
            document.getElementById('loginForm').style.display = isLogin ? '' : 'none';
            document.getElementById('registerForm').style.display = isLogin ? 'none' : '';
            document.getElementById('tabLogin').className = 'mode-tab' + (isLogin ? ' active' : '');
            document.getElementById('tabRegister').className = 'mode-tab' + (isLogin ? '' : ' active');
            document.getElementById('cardTitle').textContent = isLogin ? '欢迎回来 👋' : '创建账号 ✨';
            document.getElementById('cardSubtitle').textContent = isLogin ? '登录「动态广场」，分享你的新鲜事' : '注册后即可发布动态、点赞评论';
            document.getElementById('errorMsg').textContent = '';
        }

        // ---------- 注册 ----------
        async function register() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('registerBtn');
            errorMsg.textContent = '';
            btn.disabled = true;
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok || data.code !== 0) {
                    throw new Error(data.message || '注册失败');
                }
                window.location.href = '/index.html'; // 注册即自动登录
            } catch (e) {
                errorMsg.textContent = '❌ ' + e.message;
                btn.disabled = false;
            }
        }

        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault();
            register();
        });

        // ---------- 主题切换 ----------
        function updateToggleIcon() {
            const theme = document.documentElement.getAttribute('data-theme');
            document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateToggleIcon();
        }
        updateToggleIcon();
    </script>
</body>
</html>
