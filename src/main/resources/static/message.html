<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>私信</title>
    <script>
        // 防闪烁：在渲染前根据 localStorage 或系统偏好设置主题
        (function () {
            var saved = localStorage.getItem('theme');
            var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        :root, [data-theme="light"] {
            --bg: #f0f2f5; --card-bg: #ffffff; --text: #333333; --text-heading: #1a1a2e;
            --muted: #999999; --muted-2: #666666; --border: #d9d9d9; --border-row: #f0f0f0;
            --primary: #4a7cff; --primary-hover: #3a66e0; --shadow-card: rgba(0,0,0,0.08);
            --input-bg: #ffffff; --tag-bg: #eef2ff; --tag-text: #4a7cff; --composer-bg: #f7f8fa;
            --bubble-mine: #4a7cff; --bubble-mine-text: #fff; --bubble-other: #f0f0f0; --bubble-other-text: #333;
        }
        [data-theme="dark"] {
            --bg: #1a1a2e; --card-bg: #24243e; --text: #e4e4e4; --text-heading: #ffffff;
            --muted: #8f8fa8; --muted-2: #a8a8c0; --border: #3a3a5c; --border-row: #33334f;
            --primary: #5a8cff; --primary-hover: #6f9bff; --shadow-card: rgba(0,0,0,0.4);
            --input-bg: #2c2c4a; --tag-bg: #2e3a5c; --tag-text: #8fb0ff; --composer-bg: #2a2a48;
            --bubble-mine: #5a8cff; --bubble-mine-text: #fff; --bubble-other: #3a3a5c; --bubble-other-text: #e4e4e4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh; transition: background .3s, color .3s;
        }
        .navbar {
            position: sticky; top: 0; z-index: 100; background: var(--card-bg);
            border-bottom: 1px solid var(--border-row); padding: 0 20px; height: 56px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 1px 4px var(--shadow-card); transition: background .3s;
        }
        .navbar .brand { font-size: 20px; font-weight: 700; color: var(--primary); }
        .navbar .nav-right { display: flex; align-items: center; gap: 12px; }
        .nav-link {
            text-decoration: none; color: var(--muted-2); font-size: 14px; padding: 6px 10px;
            border-radius: 6px; transition: all .2s; border: 1px solid transparent;
        }
        .nav-link:hover { color: var(--primary); background: var(--composer-bg); }
        .navbar .username-tag { font-size: 14px; color: var(--muted-2); }
        .navbar .username-tag b { color: var(--primary); font-weight: 600; }
        .navbar .logout-btn {
            background: none; border: 1px solid var(--border); color: var(--muted-2);
            font-size: 13px; padding: 4px 12px; border-radius: 16px; cursor: pointer; transition: all .2s;
        }
        .navbar .logout-btn:hover { border-color: #ff4d4f; color: #ff4d4f; }
        .theme-toggle {
            width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
            background: var(--card-bg); color: var(--text); font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all .3s;
        }
        .theme-toggle:hover { border-color: var(--primary); }
        .container { max-width: 1000px; margin: 0 auto; padding: 24px 20px 60px; }
        .chat-layout { display: flex; gap: 20px; align-items: flex-start; }
        .conv-list {
            flex: 0 0 300px; background: var(--card-bg); border-radius: 12px;
            box-shadow: 0 2px 12px var(--shadow-card); padding: 16px; transition: background .3s;
        }
        .conv-list h3 { font-size: 15px; font-weight: 700; color: var(--text-heading); margin-bottom: 12px; }
        .conv-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 12px;
            border-radius: 10px; cursor: pointer; transition: all .2s; border-bottom: 1px solid var(--border-row);
        }
        .conv-item:last-child { border-bottom: none; }
        .conv-item:hover { background: var(--composer-bg); }
        .conv-item.active { background: var(--tag-bg); }
        .conv-avatar {
            width: 40px; height: 40px; border-radius: 50%; background: var(--tag-bg);
            color: var(--tag-text); display: flex; align-items: center; justify-content: center;
            font-weight: 700; flex-shrink: 0;
        }
        .conv-info { flex: 1; min-width: 0; }
        .conv-name { font-size: 14px; font-weight: 600; color: var(--text-heading); }
        .conv-preview { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conv-badge {
            min-width: 18px; height: 18px; line-height: 18px; background: #ff4d4f; color: #fff;
            font-size: 11px; text-align: center; border-radius: 9px; padding: 0 5px; flex-shrink: 0;
        }
        .chat-panel {
            flex: 1 1 auto; min-width: 0; background: var(--card-bg); border-radius: 12px;
            box-shadow: 0 2px 12px var(--shadow-card); display: flex; flex-direction: column;
            height: 70vh; transition: background .3s;
        }
        .chat-header {
            padding: 14px 18px; border-bottom: 1px solid var(--border-row);
            font-size: 15px; font-weight: 600; color: var(--text-heading);
        }
        .chat-body { flex: 1; overflow-y: auto; padding: 16px 18px; }
        .msg-row { display: flex; margin-bottom: 12px; }
        .msg-row.mine { justify-content: flex-end; }
        .msg-bubble {
            max-width: 70%; padding: 9px 13px; border-radius: 14px; font-size: 14px;
            line-height: 1.5; word-break: break-word;
        }
        .msg-row.mine .msg-bubble { background: var(--bubble-mine); color: var(--bubble-mine-text); border-bottom-right-radius: 4px; }
        .msg-row.other .msg-bubble { background: var(--bubble-other); color: var(--bubble-other-text); border-bottom-left-radius: 4px; }
        .msg-time { font-size: 11px; color: var(--muted); margin-top: 4px; text-align: right; }
        .chat-input { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--border-row); }
        .chat-input input {
            flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 20px;
            background: var(--input-bg); color: var(--text); font-size: 14px; outline: none; transition: border .2s;
        }
        .chat-input input:focus { border-color: var(--primary); }
        .btn {
            border: none; background: var(--primary); color: #fff; padding: 10px 20px;
            border-radius: 20px; font-size: 14px; cursor: pointer; transition: all .2s;
        }
        .btn:hover { background: var(--primary-hover); }
        .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
        .toast {
            position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: #333; color: #fff; padding: 10px 24px; border-radius: 20px; font-size: 14px;
            opacity: 0; transition: all .3s; z-index: 999;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.error { background: #ff4d4f; }
        .toast.success { background: #52c41a; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="brand">💬 站内私信</div>
        <div class="nav-right">
            <a class="nav-link" href="/index.html">🏠 首页</a>
            <a class="nav-link" href="/my.html">📝 我的文章</a>
            <a class="nav-link" href="/notification.html">🔔 通知</a>
            <span class="username-tag">👤 <b id="currentUser"></b></span>
            <button class="theme-toggle" id="themeToggle" title="切换主题" onclick="toggleTheme()">🌙</button>
            <button class="logout-btn" onclick="logout()">退出</button>
        </div>
    </div>

    <div class="container">
        <div class="chat-layout">
            <div class="conv-list">
                <h3>📋 会话列表</h3>
                <div id="convList"><div class="empty">加载中...</div></div>
            </div>
            <div class="chat-panel">
                <div class="chat-header" id="chatHeader">选择一个会话开始聊天</div>
                <div class="chat-body" id="chatBody">
                    <div class="empty">👈 从左侧选择会话，或去用户主页发起私信</div>
                </div>
                <div class="chat-input" id="chatInputBox" style="display:none;">
                    <input type="text" id="msgInput" maxlength="500" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMessage()">
                    <button class="btn" onclick="sendMessage()">发送</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = '/api/messages';
        let currentUser = '';
        let currentConvId = null;
        let currentPeerId = null;

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show ' + (type || '');
            setTimeout(() => { toast.className = 'toast'; }, 2500);
        }
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        function formatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            const pad = n => (n < 10 ? '0' + n : '' + n);
            return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }
        async function request(url, options) {
            const res = await fetch(url, options);
            let data = null;
            try { data = await res.json(); } catch (e) {}
            if (!res.ok) {
                let msg = '请求失败 (' + res.status + ')';
                if (data && data.message) msg = data.message;
                throw new Error(msg);
            }
            if (data && typeof data === 'object' && 'code' in data) {
                if (data.code !== 0) throw new Error(data.message || '请求失败');
                return data.data;
            }
            return data;
        }

        async function loadConversations() {
            try {
                const list = await request(API + '/conversations');
                const box = document.getElementById('convList');
                if (!list || list.length === 0) {
                    box.innerHTML = '<div class="empty">还没有会话，去用户主页点「发私信」吧</div>';
                    return;
                }
                box.innerHTML = '';
                list.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'conv-item' + (currentConvId === c.id ? ' active' : '');
                    const name = c.peer || '?';
                    const unread = c.unreadCount > 0 ? '<span class="conv-badge">' + (c.unreadCount > 99 ? '99+' : c.unreadCount) + '</span>' : '';
                    div.innerHTML = `
                        <div class="conv-avatar">${escapeHtml(name.charAt(0).toUpperCase())}</div>
                        <div class="conv-info">
                            <div class="conv-name">${escapeHtml(name)}</div>
                            <div class="conv-preview">${c.lastSender === currentUser ? '我：' : ''}${escapeHtml(c.lastMessage || '')}</div>
                        </div>${unread}`;
                    div.onclick = () => openConversation(c.peerId);
                    box.appendChild(div);
                });
            } catch (e) {}
        }

        async function openConversation(peerId) {
            if (!peerId) return;
            try {
                const conv = await request(API + '/conversations/' + peerId);
                currentConvId = conv.id;
                currentPeerId = conv.peerId;
                document.getElementById('chatHeader').textContent = '与 @' + conv.peer + ' 聊天中';
                document.getElementById('chatInputBox').style.display = 'flex';
                await loadMessages();
                loadConversations();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        async function loadMessages() {
            if (!currentConvId) return;
            try {
                const msgs = await request(API + '/conversations/' + currentConvId + '/messages');
                const body = document.getElementById('chatBody');
                body.innerHTML = '';
                if (!msgs || msgs.length === 0) {
                    body.innerHTML = '<div class="empty">还没有消息，打个招呼吧～</div>';
                    return;
                }
                msgs.forEach(m => {
                    const row = document.createElement('div');
                    row.className = 'msg-row ' + (m.mine ? 'mine' : 'other');
                    row.innerHTML = '<div class="msg-bubble">' + escapeHtml(m.content) +
                        '<div class="msg-time">' + (m.mine ? '我 ' : '@' + escapeHtml(m.sender) + ' ') + formatTime(m.createdAt) + '</div></div>';
                    body.appendChild(row);
                });
                body.scrollTop = body.scrollHeight;
            } catch (e) {}
        }

        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const content = input.value.trim();
            if (!content || !currentPeerId) return;
            const peerName = document.getElementById('chatHeader').textContent.replace(/与 @| 聊天中/g, '');
            try {
                await request(API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ to: peerName, content: content })
                });
                input.value = '';
                await loadMessages();
                loadConversations();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        async function checkLogin() {
            try {
                const res = await fetch('/api/auth/me');
                const data = await res.json();
                if (!res.ok || data.code !== 0) {
                    window.location.href = '/login.html';
                    return;
                }
                currentUser = data.data.username;
                document.getElementById('currentUser').textContent = currentUser;
                await loadConversations();
                // URL 带 ?with=userId 时自动打开与某人的会话
                const params = new URLSearchParams(window.location.search);
                const withId = params.get('with');
                if (withId) {
                    openConversation(withId);
                    history.replaceState(null, '', '/message.html');
                }
                // 3 秒轮询会话与消息
                setInterval(() => {
                    loadConversations();
                    if (currentConvId) loadMessages();
                }, 3000);
            } catch (e) {
                window.location.href = '/login.html';
            }
        }

        async function logout() {
            try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (e) {}
            window.location.href = '/login.html';
        }

        // ---------- 主题切换 ----------
        function updateToggleIcon() {
            const theme = document.documentElement.getAttribute('data-theme');
            document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateToggleIcon();
        }
        updateToggleIcon();
        checkLogin();
    </script>
</body>
</html>
