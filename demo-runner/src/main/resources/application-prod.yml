# 生产配置（spring.profiles.active=prod 时生效）
# 说明：演示 profile（默认）跑内存仓库，无 DataSource；本文件仅 -Pprod 构建 + prod profile 激活时加载。
# 中间件地址（Kafka/Redis/ClickHouse/Nacos）由各 @Value 默认值兜底，可在命令行/环境变量覆盖。

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/miniforum?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: '${MYSQL_PASSWORD}'
    hikari:
      # 连接池参数（P1-3 显式化）：参考公式 connections = (core×2) + disk；小池 + 池外等待是设计意图
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000      # 获取连接超时（避免无限等连接）
      max-lifetime: 1800000          # 连接最大存活 30 分钟
      pool-name: MiniForumHikari
  session:
    store-type: redis     # Session 外置 Redis（多实例共享登录态）
    timeout: 7d           # 会话存活 7 天

app:
  scheduling:
    mode: xxl        # 生产：定时任务由 XXL-Job 调度中心派发（各业务 @Scheduled 空转防双跑；演示默认 local 自调度）
  rec:
    # 冷启动池状态 Redis TTL（P2-2）：停止后自然过期，替代进程内 cleanup
    traffic-pool:
      redis-ttl-seconds: 604800       # 流量池赛马状态 7 天
    coldstart:
      redis-ttl-seconds: 2592000      # Thompson 后验 30 天

xxl:
  job:
    # 调度中心地址（需自行启动 xxl-job-admin；接入步骤见 docs/高并发优化落地清单-带优先级.md P2-5）
    admin:
      addresses: http://localhost:8080/xxl-job-admin
    accessToken: ''
    executor:
      appname: mini-forum-web       # 离线端执行器（forum-offline-job）用 mini-forum-offline
      port: 9999
      logpath: ./logs/xxl-job
