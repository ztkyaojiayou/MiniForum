server:
  port: 8090
  tomcat:
    # 高并发参数显式化（P1-3）：配合入口限流"超量排队而非直接拒绝"
    max-threads: 200            # 请求处理线程上限（经验公式：峰值QPS × 平均RT × 1.5）
    min-spare-threads: 20
    accept-count: 200           # 连接等待队列（有界，避免无限排队堆积）
    max-connections: 10000
    connection-timeout: 20000

spring:
  application:
    name: mini-forum

logging:
  pattern:
    # traceId（P1-5）：有则打印、无则留空（后台线程/未过滤路径）
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} [%X{traceId:-}] - %msg%n"
  level:
    com.tkzou.miniforum: info

app:
  # 数据持久化目录（JSON 文件）
  data-dir: ./data
  persistence:
    # 是否启用持久化
    enabled: true
    # 定时保存间隔（毫秒）
    interval-ms: 30000
  # 发帖幂等（Idempotency-Key）TTL：同一 key 在窗口内防重复发帖，过期后可重新提交
  idempotency:
    ttl-ms: 300000
  # 发帖事件 Outbox（生产）：Relayer 轮询间隔与批量（MySQL post_outbox → Kafka）
  outbox:
    poll-ms: 1000
    batch-size: 100
  rec:
    # ClickHouse 行为日志（生产）：近线 Kafka Engine 摄入 + 离线分析读取
    clickhouse:
      host: localhost
      port: 8123
    # 推荐系统配置（与 recommend.config.RecConfig 对应，可在运行时经 ConfigService 更新）
    final-top-n: 20
    merge-top-n: 200
    recall-per-channel: 100
    cold-start-ratio: 0.15
    min-behavior-for-warm: 5
    half-life-hours: 4.0
    category-max-count: 2
    mmr-lambda: 0.6
    mmr-window: 10
    new-item-age-hours: 48
    new-item-min-interactions: 5
    explore-lambda-new-user: 0.7
    explore-lambda-warm-user: 0.1
    realtime-window-minutes: 5
    realtime-window-max-events: 100
    # 画像/物品特征短 TTL 缓存（P0 高并发优化：避免每次推荐请求现算聚合，TTL<=0 禁用）
    profile-cache-ttl-ms: 30000        # 用户画像缓存（ms）：行为回流后最多滞后一个 TTL
    item-feature-cache-ttl-ms: 5000    # 物品特征（热度/计数）缓存（ms）：读多写少，短缓存即可
    hot-board-ttl-ms: 30000            # 热搜整榜缓存（ms）：整榜 Top-50 一次算好，按请求 limit 现场切片
    hot-post-ids-ttl-ms: 10000         # 热门/兜底 postId 排序缓存（ms）：只缓存 ID 顺序，VO 每请求现算
    post-cache-ttl-ms: 5000            # 单帖详情本地缓存（P3-3 热点 key）：热门帖回源压力下降，写路径失效+短TTL兜底
    # 入口单机限流（P1-4）：/api/** 按 IP 滑动窗口，超限 429（仅单实例有效，多 Pod 需分布式限流）
    rate-limit:
      enabled: true
      limit-per-window: 100            # 每窗口每 IP 放行上限
      window-ms: 60000                 # 滑动窗口（毫秒）
      key-mode: IP                     # IP | IP_PATH（IP+路径，隔离单 IP 单路径突发）
    # 关注流 inbox 封顶条数（推模式每用户 inbox 只保留最近 N 条 postId，超限淘汰最旧）
    feed:
      cap: 500
      # 大V分流阈值：粉丝数 ≥ 此值时跳过扇出（走拉模式，见 docs §2.5/§11）。
      # 预留开关，默认 10 万演示永不触发；激活前必须先实现读侧 pull 合并，否则大V新帖不进粉丝 inbox。
      big-v-fan-threshold: 100000
    # 召回通道权重（hot/topic/category/itemcf/newitem/follow）
    channel-weight: '{"hot":1.0,"topic":1.0,"category":0.6,"itemcf":1.2,"newitem":0.5,"follow":0.8}'
    # 排序特征权重（interact/quality/interest/social/author/hot/realtime）
    rank-weight: '{"interact":0.30,"quality":0.20,"interest":0.30,"social":0.15,"author":0.10,"hot":0.10,"realtime":0.05}'
    # 定时离线评估（让推荐系统"活"起来，观察指标随数据积累的变化）
    eval-enabled: true
    eval-interval-ms: 1800000      # 评估间隔（毫秒，默认 30 分钟）
    eval-train-ratio: 0.8          # 时间切分训练比例
    eval-top-k: 20
    eval-max-users: 200
    eval-min-behaviors: 50         # 行为数低于此值跳过评估
    # 流量池/赛马（新帖渐进式曝光，Wilson 下界判晋级）
    traffic-pool:
      enabled: true
      base-boost: 0.3              # 探索保底加分（让新帖进入信息流）
      tier-step: 0.2               # 每晋级一档的额外加分
      baseline: 0.05               # 互动率基线（低于 Wilson 下界则停止探索）
      z: 1.96                      # Wilson 置信系数（95%）
      tiers: '50,500,5000,50000'   # 各档曝光配额（曝光达到后判晋级）
  sim:
    # 模拟活动：定时产生少量新帖与互动，让系统像真实社区持续"转起来"（数据量可控）
    enabled: true
    # 每轮间隔（毫秒）：默认 15 分钟
    interval-ms: 900000
    # 每轮新帖数（随机 1~N，别太大）
    posts-per-tick: 2
    # 每轮互动数（点赞/评论，随机 0~N）
    interactions-per-tick: 2
