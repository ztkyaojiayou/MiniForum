<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感便签</title>
    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        :root, [data-theme="light"] {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #333333;
            --text-heading: #1a1a2e;
            --muted: #999999;
            --border: #d9d9d9;
            --primary: #4a7cff;
            --primary-hover: #3a66e0;
            --shadow: rgba(0,0,0,0.1);
        }
        [data-theme="dark"] {
            --bg: #1a1a2e;
            --card-bg: #24243e;
            --text: #e4e4e4;
            --text-heading: #ffffff;
            --muted: #8f8fa8;
            --border: #3a3a5c;
            --primary: #5a8cff;
            --primary-hover: #6f9bff;
            --shadow: rgba(0,0,0,0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .3s, color .3s;
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px var(--shadow);
            transition: background .3s, color .3s, border-color .3s;
            z-index: 10;
        }
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--card-bg);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 8px var(--shadow);
            text-decoration: none;
            transition: all .3s;
            z-index: 10;
        }
        .back-btn:hover { border-color: var(--primary); }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 30px var(--shadow);
            padding: 40px;
            width: 560px;
            max-width: 90%;
            text-align: center;
            transition: background .3s;
        }
        .card .emoji { font-size: 48px; margin-bottom: 16px; }
        .card h1 { font-size: 24px; color: var(--text-heading); margin-bottom: 8px; }
        .card .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 30px; }
        .quote-box {
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border: 1px dashed var(--border);
            border-radius: 10px;
        }
        .quote-text {
            font-size: 22px;
            line-height: 1.6;
            color: var(--text-heading);
            font-weight: 500;
        }
        .quote-author {
            margin-top: 16px;
            color: var(--muted);
            font-size: 14px;
        }
        .btn {
            margin-top: 24px;
            padding: 12px 32px;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            cursor: pointer;
            color: #fff;
            background: var(--primary);
            transition: all .2s;
        }
        .btn:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .loading { color: var(--muted); font-size: 14px; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: opacity .3s;
        }
        .toast.show { opacity: 1; }
        .fade-in { animation: fadeIn .4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <a class="back-btn" href="/index.html">← 返回</a>
    <button class="theme-toggle" id="themeToggle" title="切换主题" onclick="toggleTheme()">🌙</button>
    <div class="card">
        <div class="emoji">💡</div>
        <h1>灵感便签</h1>
        <div class="subtitle">随机一句名言，给心灵一点能量</div>
        <div class="quote-box" id="quoteBox">
            <div class="loading" id="loading">加载中...</div>
        </div>
        <button class="btn" id="nextBtn" onclick="nextQuote()">✨ 换一句</button>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        async function nextQuote() {
            const btn = document.getElementById('nextBtn');
            btn.disabled = true;
            try {
                const res = await fetch('/api/quotes/random');
                const data = await res.json();
                if (!res.ok || data.code !== 0) {
                    throw new Error(data.message || '获取失败');
                }
                const quote = data.data;
                const box = document.getElementById('quoteBox');
                box.innerHTML = '';
                box.classList.remove('fade-in');
                void box.offsetWidth;
                box.classList.add('fade-in');
                const text = document.createElement('div');
                text.className = 'quote-text';
                text.textContent = '「' + quote.text + '」';
                const author = document.createElement('div');
                author.className = 'quote-author';
                author.textContent = '—— ' + quote.author;
                box.appendChild(text);
                box.appendChild(author);
            } catch (e) {
                showToast('❌ ' + e.message);
            } finally {
                btn.disabled = false;
            }
        }

        // 首次加载
        nextQuote();

        // ---------- 主题切换 ----------
        function updateToggleIcon() {
            const theme = document.documentElement.getAttribute('data-theme');
            document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateToggleIcon();
        }
        updateToggleIcon();
    </script>
</body>
</html>
