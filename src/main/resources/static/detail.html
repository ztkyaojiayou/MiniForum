<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博文详情</title>
    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        :root, [data-theme="light"] {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #333333;
            --text-heading: #1a1a2e;
            --muted: #999999;
            --muted-2: #666666;
            --border: #d9d9d9;
            --border-row: #f0f0f0;
            --primary: #4a7cff;
            --primary-hover: #3a66e0;
            --shadow-card: rgba(0,0,0,0.08);
            --composer-bg: #f7f8fa;
            --tag-bg: #eef2ff;
            --tag-text: #4a7cff;
        }
        [data-theme="dark"] {
            --bg: #1a1a2e;
            --card-bg: #24243e;
            --text: #e4e4e4;
            --text-heading: #ffffff;
            --muted: #8f8fa8;
            --muted-2: #a8a8c0;
            --border: #3a3a5c;
            --border-row: #33334f;
            --primary: #5a8cff;
            --primary-hover: #6f9bff;
            --shadow-card: rgba(0,0,0,0.4);
            --composer-bg: #2a2a48;
            --tag-bg: #2e3a5c;
            --tag-text: #8fb0ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background .3s, color .3s;
        }
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-row);
            padding: 0 20px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 4px var(--shadow-card);
        }
        .navbar .brand { font-size: 20px; font-weight: 700; color: var(--primary); cursor: pointer; }
        .navbar .nav-right { display: flex; align-items: center; gap: 12px; }
        .nav-link {
            text-decoration: none;
            color: var(--muted-2);
            font-size: 14px;
            padding: 6px 10px;
            border-radius: 6px;
            transition: all .2s;
            border: 1px solid transparent;
        }
        .nav-link:hover { color: var(--primary); background: var(--composer-bg); }
        .navbar .username-tag { font-size: 14px; color: var(--muted-2); }
        .navbar .username-tag b { color: var(--primary); font-weight: 600; }
        .navbar .logout-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--muted-2);
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 16px;
            cursor: pointer;
            transition: all .2s;
        }
        .navbar .logout-btn:hover { border-color: #ff4d4f; color: #ff4d4f; }
        .theme-toggle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .3s;
        }
        .theme-toggle:hover { border-color: var(--primary); }
        .container { max-width: 720px; margin: 0 auto; padding: 24px 20px 60px; }
        .back-link {
            display: inline-block;
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .back-link:hover { text-decoration: underline; }
        .article {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 12px var(--shadow-card);
            padding: 32px 36px;
            transition: background .3s;
        }
        .article .article-title { font-size: 26px; font-weight: 700; color: var(--text-heading); line-height: 1.4; margin-bottom: 16px; }
        .article .meta {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-row);
            margin-bottom: 24px;
        }
        .article .avatar {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 600;
            flex-shrink: 0;
        }
        .article .author-name { font-size: 15px; font-weight: 600; color: var(--text-heading); }
          .article .avatar-link { text-decoration: none; display: inline-flex; }
          .article .avatar-link:hover .avatar { opacity: 0.85; }
          .article .author-link { text-decoration: none; }
          .article .author-link:hover .author-name { color: var(--primary); }
        .article .time { font-size: 13px; color: var(--muted); margin-top: 2px; }
        .article .article-content {
            font-size: 16px;
            line-height: 1.9;
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-word;
        }
        .article .footer { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--border-row); font-size: 13px; color: var(--muted); }
        .post-tags { margin: 12px 0; }
        .tag-chip {
            display: inline-block; padding: 3px 12px; margin: 0 6px 6px 0;
            background: var(--tag-bg); color: var(--tag-text); border-radius: 12px; font-size: 12px;
        }
        .article-stats { display: flex; align-items: center; gap: 16px; margin-top: 20px; }
        .like-btn {
            background: none; border: 1px solid var(--border); border-radius: 16px;
            padding: 5px 16px; font-size: 14px; color: var(--muted-2); cursor: pointer; transition: all .2s;
        }
        .like-btn:hover { border-color: #ff4d4f; color: #ff4d4f; }
        .like-btn.liked { border-color: #ff4d4f; color: #ff4d4f; background: rgba(255,77,79,0.08); }
        .stat-text { font-size: 14px; color: var(--muted); }
        .comments-section { margin-top: 24px; }
        .comment-composer {
            background: var(--card-bg); border-radius: 12px; box-shadow: 0 2px 12px var(--shadow-card);
            padding: 16px; margin-bottom: 16px;
        }
        .comment-composer textarea {
            width: 100%; min-height: 72px; resize: vertical; padding: 10px 12px;
            border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
            background: var(--composer-bg); color: var(--text); outline: none;
        }
        .comment-composer textarea:focus { border-color: var(--primary); }
        .comment-actions { display: flex; justify-content: flex-end; margin-top: 10px; }
        .comments-title { font-size: 16px; font-weight: 600; color: var(--text-heading); margin-bottom: 12px; }
        .comment-list { background: var(--card-bg); border-radius: 12px; box-shadow: 0 2px 12px var(--shadow-card); padding: 8px 16px; }
        .comment { padding: 14px 0; border-bottom: 1px solid var(--border-row); }
        .comment:last-child { border-bottom: none; }
        .comment-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .comment-avatar {
            width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff;
            display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0;
        }
        .comment-author { font-size: 13px; font-weight: 600; color: var(--text-heading); }
        .comment-time { font-size: 12px; color: var(--muted); }
        .comment-head .btn-sm { margin-left: auto; }
        .comment-content { font-size: 14px; line-height: 1.7; color: var(--text); white-space: pre-wrap; word-break: break-word; }
        .empty { text-align: center; color: var(--muted); padding: 40px 0; }
        .loading { text-align: center; color: var(--muted); padding: 20px; }
        .toast {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #333;
            color: #fff;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: all .3s;
            z-index: 999;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.error { background: #ff4d4f; }
        .fade-in { animation: fadeIn .4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="brand" onclick="window.location.href='/index.html'">📢 动态广场</div>
        <div class="nav-right">
            <a class="nav-link" href="/quote.html">💡 灵感</a>
            <a class="nav-link" href="/wheel.html">🎡 转盘</a>
            <span class="username-tag">👤 <b id="currentUser"></b></span>
            <button class="theme-toggle" id="themeToggle" title="切换主题" onclick="toggleTheme()">🌙</button>
            <button class="logout-btn" onclick="logout()">退出</button>
        </div>
    </div>

    <div class="container">
        <a class="back-link" href="/index.html">← 返回动态列表</a>
        <div id="loading" class="loading">加载中...</div>
        <div id="article"></div>
        <div class="comments-section" id="commentsSection" style="display:none;">
            <div class="comment-composer">
                <textarea id="commentContent" maxlength="500" placeholder="写下你的评论..."></textarea>
                <div class="comment-actions">
                    <button class="btn" style="padding:6px 20px; font-size:13px;" onclick="addComment()">💬 发表评论</button>
                </div>
            </div>
            <div class="comments-title">💬 评论 <span id="commentCount">0</span></div>
            <div class="comment-list" id="commentList">
                <div class="empty">还没有评论，快来抢沙发～</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show ' + (type || '');
            setTimeout(() => { toast.className = 'toast'; }, 2500);
        }
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        function formatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            const pad = n => (n < 10 ? '0' + n : '' + n);
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
                + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }
        function getPostId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }
        async function loadPost() {
            const id = getPostId();
            const loading = document.getElementById('loading');
            const article = document.getElementById('article');
            if (!id) {
                loading.style.display = 'none';
                article.innerHTML = '<div class="empty">缺少帖子 ID 参数</div>';
                return;
            }
            try {
                const res = await fetch('/api/posts/' + id);
                const data = await res.json();
                if (!res.ok || data.code !== 0) {
                    loading.style.display = 'none';
                    article.innerHTML = '<div class="empty">' + escapeHtml(data.message || '加载失败') + '</div>';
                    return;
                }
                const p = data.data;
                const avatarChar = (p.author || '?').charAt(0).toUpperCase();
                loading.style.display = 'none';
                article.innerHTML = `
                    <div class="article fade-in">
                        <div class="article-title">${p.title ? escapeHtml(p.title) : '（无标题）'}</div>
                        <div class="meta">
                            <a class="avatar-link" href="/user.html?id=${p.authorId}" title="${escapeHtml(p.author)}"><div class="avatar">${escapeHtml(avatarChar)}</div></a>
                            <div>
                                <a class="author-link" href="/user.html?id=${p.authorId}"><div class="author-name">${escapeHtml(p.author)}</div></a>
                                <div class="time">🕐 ${formatTime(p.createdAt)}</div>
                            </div>
                        </div>
                        ${renderTags(p.tags)}
                        <div class="article-content">${escapeHtml(p.content)}</div>
                        <div class="article-stats">
                            <button class="like-btn${p.likedByMe ? ' liked' : ''}" onclick="toggleLike(${p.id}, this)">❤️ <span class="like-num">${p.likeCount || 0}</span> 赞</button>
                            <span class="stat-text">💬 ${p.commentCount || 0} 条评论</span>
                        </div>
                        <div class="footer">#${p.id}</div>
                    </div>`;
                    document.getElementById('commentsSection').style.display = 'block';
                    loadComments(id);
            } catch (e) {
                loading.style.display = 'none';
                article.innerHTML = '<div class="empty">加载失败：' + escapeHtml(e.message) + '</div>';
            }
        }
        function renderTags(tags) {
            if (!tags || tags.length === 0) return '';
            return '<div class="post-tags">' + tags.map(function (t) {
                return '<span class="tag-chip">#' + escapeHtml(t) + '</span>';
            }).join('') + '</div>';
        }
        async function toggleLike(id, btn) {
            try {
                const method = btn.classList.contains('liked') ? 'DELETE' : 'POST';
                const res = await fetch('/api/posts/' + id + '/like', { method: method });
                const data = await res.json();
                if (!res.ok || data.code !== 0) { throw new Error(data.message || '操作失败'); }
                btn.classList.toggle('liked');
                btn.querySelector('.like-num').textContent = data.likeCount;
                showToast(method === 'POST' ? '❤️ 点赞成功' : '已取消点赞', 'success');
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }
        async function loadComments(postId) {
            const box = document.getElementById('commentList');
            try {
                const res = await fetch('/api/posts/' + postId + '/comments');
                const data = await res.json();
                if (!res.ok || data.code !== 0) { throw new Error(data.message || '加载评论失败'); }
                const comments = data.data || [];
                document.getElementById('commentCount').textContent = comments.length;
                if (comments.length === 0) {
                    box.innerHTML = '<div class="empty">还没有评论，快来抢沙发～</div>';
                } else {
                    box.innerHTML = comments.map(function (c) {
                        return `
                            <div class="comment">
                                <div class="comment-head">
                                    <span class="comment-avatar">${escapeHtml((c.author || '?').charAt(0).toUpperCase())}</span>
                                    <span class="comment-author">${escapeHtml(c.author)}</span>
                                    <span class="comment-time">${formatTime(c.createdAt)}</span>
                                    ${c.mine ? '<button class="btn btn-danger btn-sm" onclick="deleteComment(' + c.id + ')">删除</button>' : ''}
                                </div>
                                <div class="comment-content">${escapeHtml(c.content)}</div>
                            </div>`;
                    }).join('');
                }
            } catch (e) {
                box.innerHTML = '<div class="empty">加载评论失败</div>';
            }
        }
        async function addComment() {
            const postId = getPostId();
            const content = document.getElementById('commentContent').value.trim();
            if (!content) { showToast('评论内容不能为空', 'error'); return; }
            try {
                const res = await fetch('/api/posts/' + postId + '/comments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content })
                });
                const data = await res.json();
                if (!res.ok || data.code !== 0) { throw new Error(data.message || '评论失败'); }
                showToast('✅ 评论成功', 'success');
                document.getElementById('commentContent').value = '';
                loadComments(postId);
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }
        async function deleteComment(commentId) {
            if (!confirm('确定要删除这条评论吗？')) return;
            try {
                const res = await fetch('/api/comments/' + commentId, { method: 'DELETE' });
                const data = await res.json();
                if (!res.ok || data.code !== 0) { throw new Error(data.message || '删除失败'); }
                showToast('🗑️ 已删除', 'success');
                loadComments(getPostId());
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        async function checkLogin() {
            try {
                const res = await fetch('/api/auth/me');
                const data = await res.json();
                if (!res.ok || data.code !== 0) {
                    window.location.href = '/login.html';
                    return;
                }
                document.getElementById('currentUser').textContent = data.data.username;
                loadPost();
            } catch (e) {
                window.location.href = '/login.html';
            }
        }
        async function logout() {
            try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (e) {}
            window.location.href = '/login.html';
        }
        checkLogin();

        function updateToggleIcon() {
            const theme = document.documentElement.getAttribute('data-theme');
            document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateToggleIcon();
        }
        updateToggleIcon();
    </script>
</body>
</html>
