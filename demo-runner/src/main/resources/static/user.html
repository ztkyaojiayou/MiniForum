<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页</title>
    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        :root, [data-theme="light"] {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #333333;
            --text-heading: #1a1a2e;
            --muted: #999999;
            --muted-2: #666666;
            --border: #d9d9d9;
            --border-row: #f0f0f0;
            --primary: #4a7cff;
            --primary-hover: #3a66e0;
            --shadow-card: rgba(0,0,0,0.08);
            --input-bg: #ffffff;
            --tag-bg: #eef2ff;
            --tag-text: #4a7cff;
            --composer-bg: #f7f8fa;
        }
        [data-theme="dark"] {
            --bg: #1a1a2e;
            --card-bg: #24243e;
            --text: #e4e4e4;
            --text-heading: #ffffff;
            --muted: #8f8fa8;
            --muted-2: #a8a8c0;
            --border: #3a3a5c;
            --border-row: #33334f;
            --primary: #5a8cff;
            --primary-hover: #6f9bff;
            --shadow-card: rgba(0,0,0,0.4);
            --input-bg: #2c2c4a;
            --tag-bg: #2e3a5c;
            --tag-text: #8fb0ff;
            --composer-bg: #2a2a48;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background .3s, color .3s;
        }
        .navbar {
            position: sticky; top: 0; z-index: 100;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-row);
            padding: 0 20px; height: 56px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 1px 4px var(--shadow-card);
        }
        .navbar .brand { font-size: 20px; font-weight: 700; color: var(--primary); cursor: pointer; }
        .navbar .nav-right { display: flex; align-items: center; gap: 12px; }
        .nav-link {
            text-decoration: none; color: var(--muted-2); font-size: 14px;
            padding: 6px 10px; border-radius: 6px; transition: all .2s;
        }
        .nav-link:hover { color: var(--primary); background: var(--composer-bg); }
        .navbar .username-tag { font-size: 14px; color: var(--muted-2); text-decoration: none; }
        .navbar .username-tag b { color: var(--primary); font-weight: 600; }
        .navbar .logout-btn {
            background: none; border: 1px solid var(--border); color: var(--muted-2);
            font-size: 13px; padding: 4px 12px; border-radius: 16px; cursor: pointer; transition: all .2s;
        }
        .navbar .logout-btn:hover { border-color: #ff4d4f; color: #ff4d4f; }
        .theme-toggle {
            width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
            background: var(--card-bg); color: var(--text); font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all .3s;
        }
        .theme-toggle:hover { border-color: var(--primary); }
        .container { max-width: 720px; margin: 0 auto; padding: 24px 20px 60px; }
        .back-link { display: inline-block; color: var(--primary); text-decoration: none; font-size: 14px; margin-bottom: 16px; }
        .back-link:hover { text-decoration: underline; }
        .profile-card {
            background: var(--card-bg); border-radius: 12px; box-shadow: 0 2px 12px var(--shadow-card);
            padding: 28px 32px; margin-bottom: 24px; display: flex; align-items: center; gap: 20px;
            transition: background .3s;
        }
        .profile-card .big-avatar {
            width: 72px; height: 72px; border-radius: 50%;
            background: var(--primary); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 34px; font-weight: 700; flex-shrink: 0;
        }
        .profile-card .p-name { font-size: 22px; font-weight: 700; color: var(--text-heading); }
        .profile-card .p-desc { font-size: 13px; color: var(--muted); margin-top: 6px; }
        .profile-card .profile-stats { display: flex; gap: 16px; margin-top: 12px; }
        .profile-card .p-stat { font-size: 13px; color: var(--muted-2); }
        .profile-card .p-stat b { color: var(--primary); font-size: 16px; }
        .btn {
            background: var(--primary); color: #fff; border: none; border-radius: 18px;
            padding: 8px 18px; font-size: 13px; cursor: pointer; transition: all .2s; flex-shrink: 0;
        }
        .btn:hover { background: var(--primary-hover); }
        .follow-btn.following { background: transparent; border: 1px solid var(--border); color: var(--muted-2); }
        .follow-btn.following .follow-hover { display: none; }
        .follow-btn.following:hover { border-color: #ff4d4f; color: #ff4d4f; background: rgba(255, 77, 79, 0.06); }
        .follow-btn.following:hover .follow-text { display: none; }
        .follow-btn.following:hover .follow-hover { display: inline; }
        .feed-title { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 16px; color: var(--text-heading); font-size: 18px; font-weight: 700; }
        .post {
            background: var(--card-bg); border-radius: 12px; box-shadow: 0 2px 12px var(--shadow-card);
            padding: 20px 24px; margin-bottom: 16px; transition: background .3s;
        }
        .post .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .post .avatar {
            width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 600; flex-shrink: 0;
        }
        .post .post-author { font-size: 15px; font-weight: 600; color: var(--text-heading); }
        .post .post-time { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .post .post-title { font-size: 16px; font-weight: 600; color: var(--text-heading); margin-bottom: 8px; }
        .post .post-title-link { color: var(--text-heading); text-decoration: none; }
        .post .post-title-link:hover { color: var(--primary); text-decoration: underline; }
        .post .post-content {
            font-size: 14px; line-height: 1.7; color: var(--text);
            white-space: pre-wrap; word-break: break-word; margin-bottom: 12px;
        }
        .post .post-footer {
            display: flex; align-items: center; justify-content: space-between;
            border-top: 1px solid var(--border-row); padding-top: 10px;
        }
        .post .post-id { font-size: 12px; color: var(--muted); }
        .post-actions { display: flex; align-items: center; gap: 12px; }
        .stat-link { font-size: 13px; color: var(--muted-2); text-decoration: none; }
        .stat-link:hover { color: var(--primary); }
        .tag-chip {
            display: inline-block; padding: 2px 10px; margin: 0 6px 6px 0;
            background: var(--tag-bg); color: var(--tag-text); border-radius: 12px; font-size: 12px;
        }
        .pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
        .pagination button {
            padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px;
            background: var(--card-bg); color: var(--text); font-size: 14px; cursor: pointer; transition: all .2s;
        }
        .pagination button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
        .pagination button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .pagination .page-info { font-size: 13px; color: var(--muted); }
        .empty { text-align: center; color: var(--muted); padding: 40px 0; }
        .loading { text-align: center; color: var(--muted); padding: 20px; }
        .toast {
            position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: #333; color: #fff; padding: 10px 24px; border-radius: 20px;
            font-size: 14px; opacity: 0; transition: all .3s; z-index: 999;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.error { background: #ff4d4f; }
        .fade-in { animation: fadeIn .4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* 粉丝/关注列表弹窗（仿微博，可点击查看） */
        .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-mask.show { display: flex; }
        .modal { background: var(--card-bg); border-radius: 12px; padding: 24px; width: 380px; max-width: 90%; max-height: 80vh; overflow-y: auto; }
        .relation-list { margin-top: 12px; }
        .relation-item { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-bottom: 1px solid var(--border-row); cursor: pointer; border-radius: 8px; }
        .relation-item:hover { background: var(--composer-bg); }
        .relation-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; flex-shrink: 0; }
        .relation-name { font-size: 14px; color: var(--text-heading); }
        .modal-actions { display: flex; justify-content: flex-end; margin-top: 16px; }
        .btn-cancel { background: var(--composer-bg); color: var(--muted-2); border: 1px solid var(--border); }
        .p-stat { cursor: pointer; }
        .p-stat:hover { color: var(--primary); }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="brand" onclick="window.location.href='/index.html'">📢 动态广场</div>
        <div class="nav-right">
            <a class="nav-link" href="/quote.html">💡 灵感</a>
            <a class="nav-link" href="/wheel.html">🎡 转盘</a>
            <a class="nav-link" href="/my.html">📝 我的文章</a>
            <a class="nav-link" href="/notification.html">🔔 通知</a>
            <a class="username-tag" href="/my.html" title="我的主页">👤 <b id="currentUser"></b></a>
            <button class="theme-toggle" id="themeToggle" title="切换主题" onclick="toggleTheme()">🌙</button>
            <button class="logout-btn" onclick="logout()">退出</button>
        </div>
    </div>

    <div class="container">
        <a class="back-link" href="/index.html">← 返回动态列表</a>
        <div class="profile-card" id="profileCard">
            <div class="big-avatar" id="avatarChar">?</div>
            <div style="flex:1; min-width:0;">
                <div class="p-name" id="authorName">加载中...</div>
                <div class="p-desc" id="authorDesc">Ta 的文章</div>
                <div class="profile-stats">
                    <span class="p-stat">📝 文章 <b id="statPostCount">0</b></span>
                    <span class="p-stat" onclick="openRelation('followers', USER_ID)" title="查看粉丝">👥 粉丝 <b id="statFollowerCount">0</b></span>
                    <span class="p-stat" onclick="openRelation('following', USER_ID)" title="查看关注">❤️ 关注 <b id="statFollowingCount">0</b></span>
                </div>
            </div>
            <button class="btn follow-btn" id="followBtn" style="display:none;" onclick="toggleFollow()">➕ 关注</button>
            <a class="btn follow-btn" id="msgBtn" style="display:none;" href="/message.html?with=">💬 发私信</a>
        </div>
        <div class="feed-title"><span>📚 <span id="listTitle">Ta 的全部文章</span></span></div>
        <div id="loading" class="loading">加载中...</div>
        <div id="postList"></div>
        <div id="pagination" class="pagination"></div>
    </div>

    <!-- 粉丝/关注列表弹窗 -->
    <div class="modal-mask" id="relationModal">
        <div class="modal">
            <h3 id="relationTitle">粉丝</h3>
            <div class="relation-list" id="relationList"><div class="empty">加载中...</div></div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeRelation()">关闭</button>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let USER_ID = params.get('id');
        const USERNAME = params.get('username');

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show ' + (type || '');
            setTimeout(() => { toast.className = 'toast'; }, 2500);
        }
        // ---------- 粉丝/关注列表（仿微博，可点击查看） ----------
        function openRelation(type, userId) {
            document.getElementById('relationTitle').textContent = type === 'following' ? '关注' : '粉丝';
            const box = document.getElementById('relationList');
            box.innerHTML = '<div class="empty">加载中...</div>';
            document.getElementById('relationModal').classList.add('show');
            loadRelation(type, userId);
        }
        async function loadRelation(type, userId) {
            const box = document.getElementById('relationList');
            try {
                const list = await request('/api/follows/' + type + '?userId=' + userId);
                if (!list || list.length === 0) {
                    box.innerHTML = '<div class="empty">暂无' + (type === 'following' ? '关注' : '粉丝') + '</div>';
                    return;
                }
                box.innerHTML = list.map(function (u) {
                    const avatar = (u.username || '?').charAt(0).toUpperCase();
                    return '<div class="relation-item" onclick="location.href=\'/user.html?id=' + u.id + '\'">' +
                        '<span class="relation-avatar">' + escapeHtml(avatar) + '</span>' +
                        '<span class="relation-name">' + escapeHtml(u.username) + '</span>' +
                        '</div>';
                }).join('');
            } catch (e) {
                box.innerHTML = '<div class="empty">加载失败</div>';
            }
        }
        function closeRelation() {
            document.getElementById('relationModal').classList.remove('show');
        }
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        function formatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            const pad = n => (n < 10 ? '0' + n : '' + n);
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
                + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }
        async function request(url, options) {
            const res = await fetch(url, options);
            let data = null;
            try { data = await res.json(); } catch (e) {}
            if (!res.ok) {
                let msg = '请求失败 (' + res.status + ')';
                if (data && data.message) msg = data.message;
                throw new Error(msg);
            }
            if (data && typeof data === 'object' && 'code' in data) {
                if (data.code !== 0) throw new Error(data.message || '请求失败');
                return data.data;
            }
            return data;
        }

        let currentPage = 1;
        const PAGE_SIZE = 10;

        let ME_ID = null;
        async function loadUser() {
            // 支持 ?username=xxx 参数（@提及跳转）：先解析出用户 ID
            if (!USER_ID && USERNAME) {
                try {
                    const u0 = await request('/api/users/by-username/' + encodeURIComponent(USERNAME));
                    USER_ID = String(u0.id);
                } catch (e) {
                    document.getElementById('authorName').textContent = '用户不存在：@' + USERNAME;
                    return;
                }
            }
            if (!USER_ID) {
                document.getElementById('authorName').textContent = '缺少用户 ID';
                return;
            }
            try {
                const u = await request('/api/users/' + USER_ID);
                const profile = await request('/api/users/' + USER_ID + '/profile');
                const avatar = profile.avatar || (u.username || '?').charAt(0).toUpperCase();
                document.getElementById('avatarChar').textContent = avatar;
                document.getElementById('authorName').textContent = profile.nickname || u.username;
                document.getElementById('authorDesc').textContent = profile.bio || ('@' + u.username + ' 的文章');
                document.getElementById('listTitle').textContent = (profile.nickname || u.username) + ' 的全部文章';
                document.getElementById('statPostCount').textContent = profile.postCount || 0;
                document.getElementById('statFollowerCount').textContent = profile.followerCount || 0;
                document.getElementById('statFollowingCount').textContent = profile.followingCount || 0;
                // 关注状态：自己或不登录不显示关注按钮
                if (ME_ID && Number(ME_ID) !== Number(USER_ID)) {
                    const btn = document.getElementById('followBtn');
                    btn.style.display = 'inline-block';
                    const msgBtn = document.getElementById('msgBtn');
                    msgBtn.href = '/message.html?with=' + USER_ID;
                    msgBtn.style.display = 'inline-block';
                    try {
                        const st = await request('/api/follows/status/' + USER_ID);
                        // 关注三态：➕关注(橙实心) → 已关注(灰) → hover 变红"取消关注"（仿微博）
                        btn.innerHTML = st.following
                            ? '<span class="follow-text">✔️ 已关注</span><span class="follow-hover">取消关注</span>'
                            : '➕ 关注';
                        btn.className = 'btn follow-btn' + (st.following ? ' following' : '');
                    } catch (e) {}
                }
            } catch (e) {
                document.getElementById('authorName').textContent = '用户不存在';
                showToast('❌ ' + e.message, 'error');
            }
        }
        async function toggleFollow() {
            const btn = document.getElementById('followBtn');
            const following = btn.classList.contains('following');
            try {
                if (following) {
                    await request('/api/follows/' + USER_ID, { method: 'DELETE' });
                    showToast('已取消关注', 'success');
                } else {
                    await request('/api/follows/' + USER_ID, { method: 'POST' });
                    showToast('✅ 关注成功', 'success');
                }
                loadUser();
                loadPosts();
            } catch (e) {
                showToast('❌ ' + e.message, 'error');
            }
        }

        async function loadPosts(page) {
            if (page) currentPage = page;
            const list = document.getElementById('postList');
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            try {
                const data = await request('/api/users/' + USER_ID + '/posts?page=' + currentPage + '&size=' + PAGE_SIZE);
                const posts = data.records || [];
                list.innerHTML = '';
                if (posts.length === 0) {
                    list.innerHTML = '<div class="empty">Ta 还没有发布文章～</div>';
                } else {
                    posts.forEach((p, i) => {
                        const div = document.createElement('div');
                        div.className = 'post fade-in';
                        div.style.animationDelay = (i * 0.05) + 's';
                        const avatarChar = (p.author || '?').charAt(0).toUpperCase();
                        div.innerHTML = `
                            <div class="post-header">
                                <div class="avatar">${escapeHtml(avatarChar)}</div>
                                <div>
                                    <div class="post-author">${escapeHtml(p.author)}</div>
                                    <div class="post-time">🕐 ${formatTime(p.createdAt)}</div>
                                </div>
                            </div>
                            ${p.title ? `<div class="post-title"><a class="post-title-link" href="/detail.html?id=${p.id}">${escapeHtml(p.title)}</a></div>` : ''}
                            ${renderTags(p.tags)}
                            <div class="post-content">${escapeHtml(p.content)}</div>
                            <div class="post-footer">
                                <span class="post-id">#${p.id}</span>
                                <div class="post-actions">
                                    <span class="stat-link">👁 ${p.viewCount || 0}</span>
                                      <span class="stat-link">❤️ ${p.likeCount || 0}</span>
                                    <a class="stat-link" href="/detail.html?id=${p.id}">💬 ${p.commentCount || 0}</a>
                                    <a class="stat-link" href="/detail.html?id=${p.id}">📖 查看全文</a>
                                </div>
                            </div>`;
                        list.appendChild(div);
                    });
                }
                renderPagination(data.total, data.totalPages);
            } catch (e) {
                list.innerHTML = '<div class="empty">加载失败：' + escapeHtml(e.message) + '</div>';
                document.getElementById('pagination').innerHTML = '';
            } finally {
                loading.style.display = 'none';
            }
        }
        function renderTags(tags) {
            if (!tags || tags.length === 0) return '';
            return '<div class="post-tags">' + tags.map(function (t) {
                return '<span class="tag-chip" onclick="location.href=\'/tag.html?tag=\'+encodeURIComponent(\'' + escapeHtml(t) + '\')">#' + escapeHtml(t) + '</span>';
            }).join('') + '</div>';
        }
        function renderPagination(total, totalPages) {
            const box = document.getElementById('pagination');
            if (!total || totalPages <= 1) { box.innerHTML = ''; return; }
            let html = '<button class="page-btn" data-page="' + (currentPage - 1) + '" ' + (currentPage <= 1 ? 'disabled' : '') + '>‹ 上一页</button>';
            for (let i = 1; i <= totalPages; i++) {
                html += '<button class="page-btn' + (i === currentPage ? ' active' : '') + '" data-page="' + i + '">' + i + '</button>';
            }
            html += '<button class="page-btn" data-page="' + (currentPage + 1) + '" ' + (currentPage >= totalPages ? 'disabled' : '') + '>下一页 ›</button>';
            html += '<span class="page-info">共 ' + total + ' 条</span>';
            box.innerHTML = html;
            box.querySelectorAll('.page-btn').forEach(btn => {
                btn.addEventListener('click', function () {
                    if (this.disabled) return;
                    const target = parseInt(this.getAttribute('data-page'), 10);
                    if (target >= 1 && target <= totalPages) loadPosts(target);
                });
            });
        }

        async function checkLogin() {
            try {
                const res = await fetch('/api/auth/me');
                const data = await res.json();
                if (!res.ok || data.code !== 0) {
                    window.location.href = '/login.html';
                    return;
                }
                document.getElementById('currentUser').textContent = data.data.username;
                ME_ID = data.data.id;
                loadUser();
                loadPosts();
            } catch (e) {
                window.location.href = '/login.html';
            }
        }
        async function logout() {
            try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (e) {}
            window.location.href = '/login.html';
        }
        checkLogin();

        function updateToggleIcon() {
            const theme = document.documentElement.getAttribute('data-theme');
            document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateToggleIcon();
        }
        updateToggleIcon();
    </script>
</body>
</html>
